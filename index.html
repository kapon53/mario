<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kapon | Bizim Hikaye</title>
<style>
    body {
        background-color: #000; color: #fff;
        font-family: 'Press Start 2P', 'Segoe UI', monospace, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
        user-select: none; touch-action: none;
        overflow: hidden;
    }
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    #game-container { position: relative; background: #0a0a0c; padding: 4px; border-radius: 8px; border: 2px solid #333; overflow: hidden; }
    canvas { background-color: #5c94fc; display: block; border-radius: 4px; image-rendering: pixelated; touch-action: none; }

    #mobile-controls { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-top: 20px; padding: 0 10px; box-sizing: border-box; }
    .d-pad { display: flex; gap: 15px; }
    .m-btn {
        background: rgba(255, 255, 255, 0.1); border: 2px solid #fff; color: #fff;
        font-size: 24px; width: 60px; height: 60px; border-radius: 50%;
        font-weight: bold; display: flex; align-items: center; justify-content: center;
        cursor: pointer; user-select: none; touch-action: manipulation;
    }
    .m-btn:active { background: #fff; color: #000; transform: scale(0.9); }
    .btn-action { background: rgba(255, 0, 60, 0.2); border-color: #ff003c; color: #ff003c; width: 70px; height: 70px; }
    .btn-action:active { background: #ff003c; color: #fff; }

    #ui-layer {
        position: absolute; top: 15px; left: 20px; right: 20px;
        display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;
        text-shadow: 2px 2px 0 #000; pointer-events: none; text-align: center;
    }
    .ui-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }

    #mute-btn {
        position: absolute; top: 12px; right: 18px; pointer-events: auto; cursor: pointer;
        background: rgba(0,0,0,0.45); border: 2px solid #fff; color: #fff; border-radius: 8px;
        font-size: 14px; padding: 6px 10px; z-index: 600; display: none; 
    }

    #game-over-screen, #quiz-screen, #start-screen, #life-lost-screen, #level-start-screen, #level-complete-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 8px; padding: 20px; box-sizing: border-box; text-align: center;
    }
    
    #level-start-screen { background: #000; z-index: 2500; }
    #level-complete-screen { background: rgba(0,0,0,0.9); z-index: 2500; }
    #game-over-screen { background: rgba(0, 0, 0, 0.92); z-index: 1000; white-space: pre-line; }
    #go-title { font-size: 1.4em; margin: 0 0 15px 0; line-height: 1.4; color: #ff003c; text-shadow: 0 0 10px #ff003c; }

    #life-lost-screen { background: rgba(0, 0, 0, 0.95); z-index: 950; white-space: pre-line; }
    #ll-title { font-size: 1.2em; margin: 0 0 10px 0; line-height: 1.4; color: #ff5c5c; }
    #ll-sub { font-size: 0.8em; margin-bottom: 20px; color: #fff; }

    button.game-btn {
        margin-top: 10px; padding: 12px 25px; font-size: 1em; font-weight: bold;
        background: #ff003c; color: #fff; border: 2px solid #fff; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        font-family: 'Press Start 2P', monospace;
    }
    button.game-btn:active { transform: scale(0.95); }

    #quiz-screen { background: rgba(43, 0, 82, 0.96); z-index: 2000; }
    #quiz-question { font-size: 1.05em; color: #fff; margin-bottom: 25px; line-height: 1.5; text-shadow: 0 0 10px #b026ff; }
    #quiz-input {
        width: 80%; max-width: 300px; padding: 12px; font-size: 16px; font-weight: bold;
        border: 2px solid #b026ff; border-radius: 8px; background: #111; color: #fff;
        text-align: center; outline: none; margin-bottom: 20px; font-family: sans-serif;
    }
    #quiz-input:focus { box-shadow: 0 0 15px #b026ff; }
    #quiz-submit { background: #b026ff; color: #fff; border: 2px solid #fff; padding: 12px 30px; font-size: 1em; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: 'Press Start 2P', monospace;}
    #quiz-submit:active { transform: scale(0.95); }

    #start-screen { background: #000; z-index: 3000; display: flex; }
    #start-title { color: #ff003c; font-size: 1.6em; text-shadow: 0 0 15px #ff003c; margin-bottom: 10px; }
    #start-sub { color: #fff; font-size: 0.7em; margin-bottom: 25px; line-height: 1.8; max-width: 80%; }
    #start-btn { background: #00c853; padding: 14px 30px; font-size: 1.1em; border-color: #fff; }

    @media (max-width: 768px) { canvas { width: 100%; height: auto; } #ui-layer { font-size: 10px; } }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="ui-layer">
        <div class="ui-col"><span>İREM</span><span id="score">000000</span></div>
        <div class="ui-col"><span>BÖLÜM</span><span id="world-label">1-1</span></div>
        <div class="ui-col"><span>ALTIN</span><span id="coin-ui">🪙 x00</span></div>
        <div class="ui-col"><span>CAN</span><span id="hearts">❤x3</span></div>
    </div>
    
    <div id="start-screen">
        <div id="start-title">BİZİM HİKAYE</div>
        <div id="start-sub">Bu macera 4 ayrı bölümden oluşuyor.<br><br>Yoluna çıkan mor kutuları kafa atarak aç, anılarımızı hatırla ve soruları bil.<br><br>Gizli kalpleri bularak can kazan!</div>
        <button class="game-btn" id="start-btn">OYUNA BAŞLA</button>
    </div>

    <div id="level-start-screen">
        <h2 style="color:#fff; margin-bottom: 30px;">BÖLÜM 1-<span id="ls-world-num">1</span></h2>
        <div style="display:flex; align-items:center; gap:20px;">
            <div style="width:32px; height:32px; background: #f83800; border-radius:4px;"></div>
            <span style="font-size:20px;">x <span id="ls-lives-num">3</span></span>
        </div>
    </div>

    <div id="level-complete-screen">
        <h2 style="color:#00ff66;">BÖLÜM GEÇİLDİ!</h2>
        <button class="game-btn" id="btn-next-level" style="background:#00a800;">SIRADAKİ BÖLÜM ▶</button>
    </div>

    <div id="life-lost-screen">
        <h2 id="ll-title">CAN KAYBETTİN!</h2>
        <div id="ll-sub"></div>
        <button class="game-btn" id="btn-continue">DEVAM ET</button>
    </div>

    <div id="game-over-screen">
        <h2 id="go-title">YANDIN!</h2>
        <button class="game-btn" id="btn-restart">EN BAŞA DÖN</button>
    </div>

    <div id="quiz-screen">
        <div id="quiz-question">Soru</div>
        <input type="text" id="quiz-input" placeholder="Cevabı yaz..." autocomplete="off">
        <button id="quiz-submit">CEVAPLA</button>
    </div>
</div>

<div id="mobile-controls">
    <div class="d-pad">
        <div class="m-btn" id="btn-left">◀</div>
        <div class="m-btn" id="btn-right">▶</div>
    </div>
    <div class="m-btn btn-action" id="btn-jump">B</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
const gameOverScreen = document.getElementById('game-over-screen'); const lifeLostScreen = document.getElementById('life-lost-screen');
const startScreen = document.getElementById('start-screen'); const quizScreen = document.getElementById('quiz-screen');
const levelStartScreen = document.getElementById('level-start-screen'); const levelCompleteScreen = document.getElementById('level-complete-screen');
const quizInput = document.getElementById('quiz-input');

const SEGMENT_WIDTH = 1130; 
const MAX_LIVES = 3;

let currentLevelIndex = 1; 
const questionsPerLevel = [3, 3, 3, 4]; 
let globalQIndex = 0; 

let score = 0; let cameraX = 0; let isPaused = false; let isStarted = false; let reqId = null;
let checkpoints = []; let checkpointIndex = 0; let shuffledQuestions = [];
let coinCount = 0; 
const activeCoins = [];

/* ============== SES MOTORU (Çökmeye Karşı Korumalı) ============== */
const AudioEngine = {
    ctx: null, master: null,
    init() {
        if (this.ctx) return;
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return; 
            this.ctx = new AudioCtx();
            this.master = this.ctx.createGain(); this.master.gain.value = 0.22; this.master.connect(this.ctx.destination);
        } catch (e) {
            console.warn("Ses motoru baslatilamadi, oyun sessiz modda devam edecek:", e);
        }
    },
    tone(freq, dur, type = 'square', vol = 1, delay = 0) {
        if (!this.ctx) return; 
        try {
            const t0 = this.ctx.currentTime + delay; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, t0); gain.gain.setValueAtTime(vol, t0); gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(gain); gain.connect(this.master); osc.start(t0); osc.stop(t0 + dur + 0.02);
        } catch(e) {}
    },
    jump() { this.tone(520, 0.12, 'square', 0.5); this.tone(780, 0.1, 'square', 0.3, 0.05); },
    stomp() { this.tone(180, 0.15, 'square', 0.6); },
    correct() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.15, 'square', 0.5, i * 0.09)); },
    wrong() { this.tone(200, 0.3, 'sawtooth', 0.5); this.tone(150, 0.35, 'sawtooth', 0.4, 0.1); },
    lifeLost() { this.tone(300, 0.2, 'sawtooth', 0.5); this.tone(220, 0.25, 'sawtooth', 0.5, 0.12); this.tone(140, 0.4, 'sawtooth', 0.5, 0.24); },
    fanfare() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.25, 'square', 0.5, i * 0.14)); },
    powerup() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.1, 'square', 0.4, i * 0.08)); }
};

/* ============== MOBİL UYUMLU BAĞLAYICILAR (Çarpışma & Tıklama Çözümü) ============== */
function bindUIBtn(id, action) {
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.addEventListener('click', action);
    btn.addEventListener('touchstart', action, {passive: false});
}

const keys = { right: false, left: false, up: false };
function resetKeys() { keys.right = false; keys.left = false; keys.up = false; }
function inputBlocked() { return quizScreen.style.display === 'flex' || gameOverScreen.style.display === 'flex' || lifeLostScreen.style.display === 'flex' || startScreen.style.display === 'flex' || levelStartScreen.style.display === 'flex' || levelCompleteScreen.style.display === 'flex'; }

window.addEventListener('keydown', (e) => { if (inputBlocked()) return; if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true; if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true; if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') { keys.up = true; e.preventDefault(); } });
window.addEventListener('keyup', (e) => { if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false; if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false; if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false; });

const bindControl = (elem, isDown) => {
    const handler = e => { e.preventDefault(); if(elem.id === 'btn-left') keys.left = isDown; else if(elem.id === 'btn-right') keys.right = isDown; else keys.up = isDown; };
    if(isDown) { elem.addEventListener('pointerdown', handler); elem.addEventListener('touchstart', handler, {passive: false}); }
    else { elem.addEventListener('pointerup', handler); elem.addEventListener('touchend', handler); elem.addEventListener('pointercancel', handler); elem.addEventListener('touchcancel', handler); }
};
const btnLeft = document.getElementById('btn-left'); const btnRight = document.getElementById('btn-right'); const btnJump = document.getElementById('btn-jump');
bindControl(btnLeft, true); bindControl(btnLeft, false); bindControl(btnRight, true); bindControl(btnRight, false); bindControl(btnJump, true); bindControl(btnJump, false);

/* ============== YENİ ALTIN (COIN) SİSTEMİ ============== */
function addCoin(x, y) {
    coinCount++; score += 10; updateScore();
    
    if (coinCount >= 100) {
        coinCount = 0; 
        if(player.lives < MAX_LIVES) {
            player.lives++;
            updateHeartsUI(); 
        }
        AudioEngine.powerup(); 
    }
    
    document.getElementById('coin-ui').innerText = '🪙 x' + String(coinCount).padStart(2, '0');
    activeCoins.push({ x: x + 8, y: y - 16, vy: -8, opacity: 1 });
    AudioEngine.jump(); 
}

function updateActiveCoins() {
    if (isPaused || !isStarted) return;
    for (let i = activeCoins.length - 1; i >= 0; i--) {
        let c = activeCoins[i];
        c.y += c.vy; 
        c.vy += 0.8; 
        if (c.vy > 0) c.opacity -= 0.12; 
        if (c.opacity <= 0) activeCoins.splice(i, 1); 
    }
}

const questionsData = [
    { q: "Sana resmi olarak ilk aşkım dediğim tarih?", answers: ["13 mart", "13.03", "13mart"], failMsg: "İlk aşkım dediğim günü nasıl bilemezsin! 💔" },
    { q: "Tartıştığımızda genellikle kim haklı olur? 🙄", answers: ["irem", "ben"], failMsg: "Daima sen haklısın, bunu bilmen lazımdı! 😂" },
    { q: "Kim daha düşürücü? 🫠", answers: ["kerem", "sen"], failMsg: "Bence bunu bir daha düşün... 😉" },
    { q: "Kim daha uykucu?", answers: ["irem", "ben"], failMsg: "Uykucu şirin kim biliyoruz... 😴" },
    { q: "Kim daha çok seven kişinin PLANLARINI BOZUYOR????????? 🤔", answers: ["irem", "ben"], failMsg: "İtiraf etsene planları kim bozuyor! 🧐" },
    { q: "Sana aşkım deyip korktuğum tarih?", answers: ["14 subat", "14.02", "sevgililer gunu", "14subat"], failMsg: "Korkudan titrediğim o günü nasıl bilmezsin! 😱" },
    { q: "Göndermelerin olduğu tartışma tarihi?", answers: ["yok", "-", "hic", "boyle bir tarih yok", "hatirlamiyorum"], failMsg: "O kadar gönderme boşa mı gitti yani? 🙄" },
    { q: "WP'ye geçtiğimiz tarih?", answers: ["1 nisan", "01.04", "1nisan"], failMsg: "O tarihi bileceksin... O kadar heyecanlanmıştık! 😤" },
    { q: "Kim numaralaşmak istedi? 🙄 (DÜNYANIN EN UTANÇ ANI)", answers: ["kerem", "sen"], failMsg: "O utanç anını başkasına yıkamazsın! 🫣" },
    { q: "Benim çok sevip (fav değil) senin HİÇ sevmediğin yemek?", answers: ["nohut"], failMsg: "Nasıl sevmezsin nohutu ya... Bilemedin! 😡" },
    { q: "Senin bayıla bayıla yediğin, benim nefret ettiğim o 'Gıda Katliamı' yemek? 🤢🤮", answers: ["doner", "soslu", "soslu doner", "bol soslu doner"], failMsg: "O soslu döneri midesi alan tek kişi sensin! 🤮" },
    { q: "Kurgu yaptığımızda çıktığımız date'de sen hangi tatlıyı yedin?", answers: ["fistik", "sarma", "fistik sarma"], failMsg: "Yediğin tatlıyı bile unuttun mu? İnanılmaz... 🍰" },
    { q: "Benim en nefret ettiğim kişi (sen bayılırsın bu kişiye) 😡", answers: ["fatih"], failMsg: "O isme tahammülüm yok, cevabı nasıl bilemezsin! 😡" }
];
let currentQuizBlock = null;

function initQuestions() {
    shuffledQuestions = questionsData.map((_, i) => i);
    for (let i = shuffledQuestions.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffledQuestions[i], shuffledQuestions[j]] = [shuffledQuestions[j], shuffledQuestions[i]]; }
}

/* ============== MARIO ÇİZİMİ ============== */
function marioFrame(isJumping, walkToggle) {
    const R = '#f83800', B = '#0058f8', S = '#f8b800', H = '#5c3800', Y = '#ffff00', _ = null;
    if (isJumping) return [[_,_,_,R,R,R,R,R,R,_,_,_],[_,_,R,R,R,R,R,R,R,R,R,_],[_,_,H,H,H,S,S,H,S,_,_,_],[_,H,S,H,S,S,S,H,S,S,S,_],[_,H,S,H,H,S,S,S,H,S,S,S],[_,H,H,S,S,S,S,H,H,H,H,_],[_,_,_,S,S,S,S,S,S,S,_,_],[_,_,_,R,R,R,B,R,R,_,_,_],[_,_,R,R,R,R,B,R,R,R,_,_],[_,R,R,R,R,B,B,B,B,R,R,_],[_,S,S,R,B,Y,B,B,Y,B,R,_],[_,S,S,S,B,B,B,B,B,B,S,_],[_,_,S,B,B,B,B,B,B,B,B,_],[_,_,B,B,B,B,_,B,B,B,B,_],[_,H,H,H,_,_,_,_,H,H,H,_],[H,H,H,H,_,_,_,_,H,H,H,H]];
    const base = [[_,_,_,R,R,R,R,R,R,_,_,_],[_,_,R,R,R,R,R,R,R,R,R,_],[_,_,H,H,H,S,S,H,S,_,_,_],[_,H,S,H,S,S,S,H,S,S,S,_],[_,H,S,H,H,S,S,S,H,S,S,S],[_,H,H,S,S,S,S,H,H,H,H,_],[_,_,_,S,S,S,S,S,S,S,_,_],[_,_,R,R,B,R,R,R,_,_,_,_],[_,R,R,R,B,R,R,B,R,R,R,_],[R,R,R,R,B,B,B,B,R,R,R,R],[S,S,R,B,Y,B,B,Y,B,R,S,S],[S,S,S,B,B,B,B,B,B,S,S,S],[S,S,B,B,B,B,B,B,B,B,S,S],[_,_,B,B,B,_,_,B,B,B,_,_],[_,H,H,H,_,_,_,_,H,H,H,_],[H,H,H,H,_,_,_,_,H,H,H,H]];
    if (walkToggle) { base[14] = [_,_,H,H,H,_,_,_,_,H,H,_]; base[15] = [_,H,H,H,H,_,_,_,H,H,H,_]; }
    return base;
}
function drawMario(x, y, isJumping, direction, walkToggle) {
    const pixels = marioFrame(isJumping, walkToggle); const pixelSize = 2;
    ctx.save(); ctx.translate(x, y); if (direction < 0) { ctx.scale(-1, 1); ctx.translate(-24, 0); }
    for (let r = 0; r < pixels.length; r++) { for (let c = 0; c < pixels[r].length; c++) { if (pixels[r][c] !== null) { ctx.fillStyle = pixels[r][c]; ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize); } } }
    ctx.restore();
}

function drawCloud(x, y) {
    if(currentLevelIndex % 2 === 0) return; 
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.beginPath(); ctx.arc(x + 20, y + 15, 15, 0, Math.PI * 2); ctx.arc(x + 45, y + 5, 20, 0, Math.PI * 2); ctx.arc(x + 70, y + 15, 15, 0, Math.PI * 2); ctx.fillRect(x + 20, y + 5, 50, 25); ctx.fill();
}
function drawHill(x, y, size) {
    if(currentLevelIndex % 2 === 0) return; 
    ctx.fillStyle = '#00a800'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + size / 2, y - size / 1.5); ctx.lineTo(x + size, y); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#00d000'; ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + size / 2, y - size / 1.5 + 10); ctx.lineTo(x + size / 2 + 10, y - size / 1.5 + 10); ctx.lineTo(x + 25, y); ctx.fill();
}
function drawCastle(x, y) {
    ctx.fillStyle = '#c84c0c'; ctx.fillRect(x, y - 100, 120, 100); ctx.strokeStyle = '#000'; ctx.strokeRect(x, y - 100, 120, 100);
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x + 60, y - 15, 20, Math.PI, 0); ctx.fillRect(x + 40, y - 15, 40, 15); ctx.fill();
    for(let i=0; i<3; i++) { ctx.fillStyle = '#c84c0c'; ctx.fillRect(x + 10 + i*40, y - 130, 25, 30); ctx.strokeRect(x + 10 + i*40, y - 130, 25, 30); ctx.fillStyle = '#000'; ctx.fillRect(x + 15 + i*40, y - 120, 15, 15); }
}

/* ============== OYUNCU ============== */
const player = {
    x: 50, y: 50, width: 24, height: 32,
    vx: 0, vy: 0, speed: 5.2, jumpPower: -13.5, gravity: 0.65,
    grounded: false, isDead: false, facingRight: true, levelFinished: false,
    lives: MAX_LIVES, walkTimer: 0, walkToggle: false, standingOn: null,

    update() {
        if (this.isDead || isPaused || !isStarted || this.levelFinished) return;

        if (keys.right) { this.vx = this.speed; this.facingRight = true; }
        else if (keys.left) { this.vx = -this.speed; this.facingRight = false; }
        else this.vx = 0;

        if (this.vx !== 0 && this.grounded) { this.walkTimer++; if (this.walkTimer > 8) { this.walkToggle = !this.walkToggle; this.walkTimer = 0; } } 
        else { this.walkToggle = false; this.walkTimer = 0; }

        if (keys.up && this.grounded) { this.vy = this.jumpPower; this.grounded = false; AudioEngine.jump(); }
        if (this.standingOn && this.standingOn.type === 'moving') { this.y += this.standingOn.vy; }

        this.vy += this.gravity;
        const prevX = this.x; this.x += this.vx; if (this.x < 0) this.x = 0; this.checkCollisions('x', prevX);
        const prevY = this.y; this.y += this.vy; this.grounded = false; this.standingOn = null; this.checkCollisions('y', prevY);

        if (this.standingOn && this.standingOn.type === 'crumble' && !this.standingOn.broken) {
            this.standingOn.crumbleTimer = (this.standingOn.crumbleTimer || 0) + 1; if (this.standingOn.crumbleTimer > 40) this.standingOn.broken = true;
        }

        for (let i = 0; i < healthHearts.length; i++) {
            const h = healthHearts[i];
            if (!h.collected && this.x < h.x + 20 && this.x + this.width > h.x && this.y < h.y + 20 && this.y + this.height > h.y) {
                h.collected = true;
                if(this.lives < MAX_LIVES) { this.lives++; updateHeartsUI(); AudioEngine.powerup(); } else { score += 500; updateScore(); AudioEngine.powerup(); }
            }
        }

        for (let i = 0; i < enemies.length; i++) {
            let e = enemies[i];
            if (e.alive && this.x < e.x + e.width && this.x + this.width > e.x && this.y < e.y + e.height && this.y + this.height > e.y) {
                const wasAbove = (this.y - this.vy + this.height) <= e.y + 6;
                if (e.stompable && this.vy > 0 && wasAbove) {
                    e.alive = false; this.vy = -7; score += 100; updateScore(); AudioEngine.stomp();
                } else { loseLife(e.kind === 'piranha' ? "PİRANHA BİTKİSİ SENİ YEDİ! 🥀" : "BİR CANLIYA ÇARPTIN! 👾"); return; }
            }
        }

        const finishX = checkpoints.length ? checkpoints[checkpoints.length - 1].x + 300 : Infinity;
        if (this.x >= finishX + 30 && !this.levelFinished) { 
            this.levelFinished = true;
            isPaused = true;
            AudioEngine.fanfare();
            
            setTimeout(() => {
                if(currentLevelIndex < 4) {
                    levelCompleteScreen.style.display = 'flex'; 
                } else {
                    winGame(); 
                }
            }, 3000);
        }
        
        if (this.y > canvas.height + 150) { loseLife("ÇUKURA DÜŞTÜN! 😱"); return; }
        
        let currentSeg = 0;
        for(let i=0; i<checkpoints.length; i++) { if(this.x >= checkpoints[i].x - 100) currentSeg = i; }
        if (currentSeg > checkpointIndex) { checkpointIndex = currentSeg; }
    },

    checkCollisions(axis, prevPos) {
        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];
            if (p.destroyed || p.type === 'gate' && p.linked.hit) continue;

            if (this.x < p.x + p.width && this.x + this.width > p.x && this.y < p.y + p.height && this.y + this.height > p.y) {
                if (axis === 'x') {
                    if (prevPos + this.width <= p.x) this.x = p.x - this.width;
                    else if (prevPos >= p.x + p.width) this.x = p.x + p.width;
                    this.vx = 0;
                } else if (axis === 'y') {
                    if (this.vy > 0) {
                        this.y = p.y - this.height; this.grounded = true; this.standingOn = p;
                    } else if (this.vy < 0) {
                        this.y = p.y + p.height; this.vy = 0;
                        if (p.type === 'quizblock' && !p.hit && !isPaused) { triggerQuiz(p); } 
                        else if (p.type === 'brick') { p.destroyed = true; score += 50; updateScore(); AudioEngine.stomp(); }
                        else if (p.type === 'coinblock' && !p.hit) {
                            if (p.hitsLeft === undefined) p.hitsLeft = 1; 
                            
                            if (p.hitsLeft > 0) {
                                addCoin(p.x, p.y);
                                p.hitsLeft--;
                                if (p.hitsLeft <= 0) p.hit = true; 
                            }
                        }
                    }
                    this.vy = 0;
                }
            }
        }
    },

    draw() { if (!this.isDead) drawMario(this.x, this.y, !this.grounded, this.facingRight ? 1 : -1, this.walkToggle); }
};

/* ============== SEVİYE OLUŞTURMA ============== */
const platforms = []; const enemies = []; const healthHearts = [];

function addQuizAndGate(cx, qx, qy, qIndex) {
    const block = { x: qx, y: qy, width: 32, height: 32, type: 'quizblock', hit: false, qIndex }; platforms.push(block);
    platforms.push({ x: qx + 70, y: -1200, width: 22, height: 1700, type: 'gate', linked: block }); return block;
}

function createLevel() {
    platforms.length = 0; enemies.length = 0; healthHearts.length = 0; checkpoints = []; checkpointIndex = 0;
    
    // YENİ TEST KUTUSU (Yüksekliği 310'a indirildi ve 5 altın hakkı verildi)
    platforms.push({ x: 350, y: 310, width: 32, height: 32, type: 'coinblock', hit: false, hitsLeft: 5 });
    
    if(currentLevelIndex % 2 === 0) { canvas.style.backgroundColor = '#000000'; } 
    else { canvas.style.backgroundColor = '#5c94fc'; }

    let cx = 0;
    let questionsForThisLevel = questionsPerLevel[currentLevelIndex - 1]; 
    let segmentsThisLevel = questionsForThisLevel * 2; 

    for (let i = 0; i < segmentsThisLevel; i++) {
        checkpoints.push({ x: cx + 20, y: 50 });
        let type = globalQIndex % 4; 
        let putQuestion = (i % 2 === 1); 

        if (type === 0) {
            platforms.push({ x: cx, y: 420, width: 1200, height: 50, type: 'ground' });
            platforms.push({ x: cx + 300, y: 260, width: 32, height: 32, type: 'brick' });
            
            if (putQuestion) { addQuizAndGate(cx, cx + 332, 260, shuffledQuestions[globalQIndex]); globalQIndex++; } 
            else { platforms.push({ x: cx + 332, y: 260, width: 32, height: 32, type: 'brick' }); }

            platforms.push({ x: cx + 364, y: 260, width: 32, height: 32, type: 'brick' });
            enemies.push({ x: cx + 500, y: 396, width: 24, height: 24, minX: cx + 450, maxX: cx + 650, vx: -1.5, alive: true, stompable: true, kind: 'goomba' });
            platforms.push({ x: cx + 800, y: 388, width: 32, height: 32, type: 'solid' }); platforms.push({ x: cx + 832, y: 356, width: 32, height: 64, type: 'solid' }); platforms.push({ x: cx + 864, y: 324, width: 32, height: 96, type: 'solid' }); platforms.push({ x: cx + 896, y: 292, width: 32, height: 128, type: 'solid' });
        }
        else if (type === 1) {
            platforms.push({ x: cx, y: 420, width: 1200, height: 50, type: 'ground' });
            platforms.push({ x: cx + 250, y: 340, width: 48, height: 80, type: 'pipe' });
            enemies.push({ kind: 'piranha', x: cx + 258, width: 32, height: 40, startY: 340, timer: 0, alive: true, stompable: false });
            platforms.push({ x: cx + 450, y: 300, width: 48, height: 120, type: 'pipe' });
            enemies.push({ kind: 'piranha', x: cx + 458, width: 32, height: 40, startY: 300, timer: 1.5, alive: true, stompable: false });
            
            if (putQuestion) { addQuizAndGate(cx, cx + 700, 200, shuffledQuestions[globalQIndex]); globalQIndex++; } 
            else { platforms.push({ x: cx + 700, y: 200, width: 32, height: 32, type: 'brick' }); }

            enemies.push({ x: cx + 850, y: 396, width: 24, height: 24, minX: cx + 750, maxX: cx + 1000, vx: -2, alive: true, stompable: true, kind: 'goomba' });
        }
        else if (type === 2) {
            platforms.push({ x: cx, y: 420, width: 300, height: 50, type: 'ground' });
            platforms.push({ x: cx + 400, y: 360, width: 80, height: 20, type: 'moving', minY: 150, maxY: 380, vy: -1.5 });
            platforms.push({ x: cx + 600, y: 260, width: 32, height: 32, type: 'brick' });
            
            if (putQuestion) { addQuizAndGate(cx, cx + 632, 260, shuffledQuestions[globalQIndex]); globalQIndex++; } 
            else { platforms.push({ x: cx + 632, y: 260, width: 32, height: 32, type: 'brick' }); }

            platforms.push({ x: cx + 664, y: 260, width: 32, height: 32, type: 'brick' });
            platforms.push({ x: cx + 800, y: 420, width: 400, height: 50, type: 'ground' });
        }
        else if (type === 3) {
            platforms.push({ x: cx, y: 420, width: 1200, height: 50, type: 'ground' });
            platforms.push({ x: cx + 200, y: 260, width: 32, height: 32, type: 'brick' }); platforms.push({ x: cx + 232, y: 260, width: 32, height: 32, type: 'brick' }); platforms.push({ x: cx + 264, y: 260, width: 32, height: 32, type: 'brick' });
            
            if (putQuestion) { addQuizAndGate(cx, cx + 550, 150, shuffledQuestions[globalQIndex]); globalQIndex++; } 
            else { platforms.push({ x: cx + 550, y: 150, width: 32, height: 32, type: 'brick' }); }

            platforms.push({ x: cx + 550, y: 280, width: 32, height: 32, type: 'solid' }); 
            enemies.push({ x: cx + 300, y: 396, width: 24, height: 24, minX: cx + 200, maxX: cx + 500, vx: -1.5, alive: true, stompable: true, kind: 'goomba' });
        }

        if (i % 3 === 1) { healthHearts.push({ x: cx + 300, y: 120, collected: false }); }

        cx += 1200 + 130;
    }
    
    platforms.push({ x: cx, y: 420, width: 1000, height: 50, type: 'ground' }); 
    enemies.forEach(e => { e.startX = e.x; e.startY = e.y; });
    
    document.getElementById('world-label').innerText = `1-${currentLevelIndex}`;
}

function updateEnemies() {
    if (isPaused || !isStarted) return;
    enemies.forEach(e => {
        if (!e.alive) return;
        if (e.kind === 'piranha') { e.timer += 0.04; e.y = e.startY - Math.abs(Math.sin(e.timer)) * 42; } 
        else if (e.kind === 'flyer') { e.y += e.vy; if (e.y <= e.minY || e.y >= e.maxY) e.vy *= -1; } 
        else { e.x += e.vx; if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1; }
    });
}
function updateMovingPlatforms() {
    if (isPaused || !isStarted) return;
    platforms.forEach(p => { if (p.type === 'moving') { p.y += p.vy; if (p.y <= p.minY || p.y >= p.maxY) p.vy *= -1; } });
}

/* ============== BÖLÜM GEÇİŞ VE ARAYÜZ FONKSİYONLARI ============== */
function startLevelTransition() {
    startScreen.style.display = 'none';
    levelCompleteScreen.style.display = 'none';
    document.getElementById('ls-world-num').innerText = currentLevelIndex;
    document.getElementById('ls-lives-num').innerText = player.lives;
    levelStartScreen.style.display = 'flex';
    
    setTimeout(() => {
        levelStartScreen.style.display = 'none';
        isStarted = true;
        isPaused = false;
    }, 2000); 
}

bindUIBtn('start-btn', (e) => {
    e.preventDefault();
    if (isStarted) return;
    AudioEngine.init();
    if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') { try { AudioEngine.ctx.resume(); } catch(err){} }
    try { AudioEngine.startMusic(); } catch(err){}
    startLevelTransition();
});

bindUIBtn('btn-next-level', (e) => {
    e.preventDefault();
    currentLevelIndex++;
    player.x = 50; player.y = 50; player.vx = 0; player.vy = 0; player.levelFinished = false;
    createLevel();
    startLevelTransition();
});

bindUIBtn('btn-continue', (e) => {
    e.preventDefault();
    lifeLostScreen.style.display = 'none'; const cp = checkpoints[checkpointIndex];
    player.x = cp.x; player.y = cp.y; player.vx = 0; player.vy = 0; player.isDead = false; isPaused = false;
    platforms.forEach(p => { if (p.type === 'brick') p.destroyed = false; });
    enemies.forEach(e => { e.alive = true; e.x = e.startX; e.y = e.startY; if(e.kind === 'piranha') e.timer = 0; });
});

bindUIBtn('btn-restart', (e) => {
    e.preventDefault();
    if (document.getElementById('btn-restart').innerText === "SENİ ÇOK SEVİYORUM!") return;
    fullRestart();
});


/* ============== QUIZ SİSTEMİ ============== */
function triggerQuiz(blockInfo) {
    resetKeys(); isPaused = true; currentQuizBlock = blockInfo;
    const quizData = questionsData[blockInfo.qIndex];
    document.getElementById('quiz-question').innerText = quizData.q;
    quizInput.value = ''; quizScreen.style.display = 'flex'; requestAnimationFrame(() => quizInput.focus());
}

bindUIBtn('quiz-submit', (e) => { e.preventDefault(); checkTypedAnswer(); });
quizInput.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); checkTypedAnswer(); }});

function normalizeText(s) { return s.toLowerCase().trim().replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/i̇/g, 'i').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u'); }

function checkTypedAnswer() {
    const userAnswer = normalizeText(quizInput.value);
    if (userAnswer.length < 1) return; 

    if(userAnswer === "seni seviyorum" || userAnswer === "seni cok seviyorum") {
        quizScreen.style.display = 'none'; resetKeys(); currentQuizBlock.hit = true;
        if(player.lives < MAX_LIVES) { player.lives++; updateHeartsUI(); AudioEngine.powerup(); alert("Gizli Şifre Bulundu! 💖\nKerem de seni çok seviyor... +1 Can kazandın!"); } 
        else { score += 1000; updateScore(); AudioEngine.powerup(); alert("Gizli Şifre Bulundu! 💖\nKerem de seni çok seviyor..."); }
        isPaused = false; return;
    }

    const quizData = questionsData[currentQuizBlock.qIndex];
    let isCorrect = quizData.answers.some(ans => { if (userAnswer === ans || userAnswer.includes(ans)) return true; return false; });

    quizScreen.style.display = 'none'; resetKeys();
    if (isCorrect) { currentQuizBlock.hit = true; score += 500; updateScore(); isPaused = false; AudioEngine.correct(); } 
    else { isPaused = false; AudioEngine.wrong(); loseLife(quizData.failMsg); }
}

/* ============== ÇİZİM ============== */
function drawGame() {
    for (let i = 0; i < 40; i++) { drawCloud(150 + i * 400, 60 + (i % 3) * 30); }
    for (let i = 0; i < 20; i++) { drawHill(250 + i * 600, 420, 150); drawHill(500 + i * 600, 420, 90); }

    const finishX = checkpoints[checkpoints.length - 1].x + 300;
    ctx.fillStyle = '#fff'; ctx.fillRect(finishX, 50, 4, 370); 
    ctx.fillStyle = '#00a800'; ctx.fillRect(finishX - 6, 42, 16, 16); 
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(finishX + 4, 60); ctx.lineTo(finishX + 40, 75); ctx.lineTo(finishX + 4, 90); ctx.fill();
    drawCastle(finishX + 150, 420); 

    enemies.forEach(e => {
        if (!e.alive) return;
        if (e.kind === 'piranha') {
            ctx.fillStyle = '#00a800'; ctx.fillRect(e.x+12, e.y+20, 8, 20); 
            ctx.fillStyle = '#ff003c'; ctx.beginPath(); ctx.arc(e.x+16, e.y+10, 14, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = '#fff'; ctx.fillRect(e.x+2, e.y+5, 28, 4); 
            ctx.fillStyle = '#000'; ctx.fillRect(e.x+14, e.y+2, 4, 4); 
        }
        else if (e.kind === 'flyer') {
            ctx.fillStyle = '#7a2a8a'; ctx.fillRect(e.x, e.y, e.width, e.height); ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.moveTo(e.x, e.y + 10); ctx.lineTo(e.x - 12, e.y + 2); ctx.lineTo(e.x, e.y + 18); ctx.fill();
            ctx.beginPath(); ctx.moveTo(e.x + e.width, e.y + 10); ctx.lineTo(e.x + e.width + 12, e.y + 2); ctx.lineTo(e.x + e.width, e.y + 18); ctx.fill();
            ctx.fillStyle = '#ff003c'; ctx.fillRect(e.x + 6, e.y + 8, 4, 4); ctx.fillRect(e.x + 14, e.y + 8, 4, 4);
        } else {
            ctx.fillStyle = '#8b4513'; ctx.fillRect(e.x, e.y, e.width, e.height);
            ctx.fillStyle = '#ffcc99'; ctx.fillRect(e.x, e.y + 20, 8, 4); ctx.fillRect(e.x + 16, e.y + 20, 8, 4);
            ctx.fillStyle = '#fff'; ctx.fillRect(e.x + 4, e.y + 6, 6, 8); ctx.fillRect(e.x + 14, e.y + 6, 6, 8);
            ctx.fillStyle = '#000'; ctx.fillRect(e.x + 6, e.y + 10, 2, 2); ctx.fillRect(e.x + 16, e.y + 10, 2, 2);
        }
    });

    platforms.forEach(p => {
        if(p.destroyed) return; 
        
        if (p.type === 'ground' || p.type === 'solid') {
            if(currentLevelIndex % 2 === 0) {
                ctx.fillStyle = '#0000a8'; ctx.fillRect(p.x, p.y + 10, p.width, p.height - 10); 
                ctx.fillStyle = '#00d000'; ctx.fillRect(p.x, p.y, p.width, 10); 
            } else {
                ctx.fillStyle = '#c84c0c'; ctx.fillRect(p.x, p.y + 10, p.width, p.height - 10);
                ctx.fillStyle = '#00a800'; ctx.fillRect(p.x, p.y, p.width, 10); 
            }
            ctx.fillStyle = '#000'; ctx.fillRect(p.x, p.y, p.width, 2); ctx.fillRect(p.x, p.y+10, p.width, 2); 
            ctx.strokeRect(p.x, p.y, p.width, p.height);
        } else if (p.type === 'brick') {
            ctx.fillStyle = currentLevelIndex % 2 === 0 ? '#0000a8' : '#c84c0c'; ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, p.y, p.width, p.height);
            ctx.beginPath(); ctx.moveTo(p.x, p.y+16); ctx.lineTo(p.x+p.width, p.y+16); ctx.stroke(); 
        } else if (p.type === 'pipe') {
            ctx.fillStyle = '#008800'; ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#00d000'; ctx.fillRect(p.x + 5, p.y, 12, p.height); 
            ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#008800'; ctx.fillRect(p.x - 4, p.y, p.width + 8, 20); 
            ctx.fillStyle = '#00d000'; ctx.fillRect(p.x + 1, p.y, 12, 20); 
            ctx.strokeRect(p.x - 4, p.y, p.width + 8, 20);
        } else if (p.type === 'coinblock' || p.type === 'quizblock') {
            if (p.hit) {
                ctx.fillStyle = '#c84c0c'; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#000'; 
                ctx.fillRect(p.x + 4, p.y + 4, 4, 4); ctx.fillRect(p.x + p.width - 8, p.y + 4, 4, 4);
                ctx.fillRect(p.x + 4, p.y + p.height - 8, 4, 4); ctx.fillRect(p.x + p.width - 8, p.y + p.height - 8, 4, 4);
            } else {
                ctx.fillStyle = p.type === 'quizblock' ? '#b026ff' : '#f8b800'; 
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.width, p.height);
                
                ctx.fillStyle = '#000';
                ctx.fillRect(p.x + 4, p.y + 4, 4, 4); ctx.fillRect(p.x + p.width - 8, p.y + 4, 4, 4);
                ctx.fillRect(p.x + 4, p.y + p.height - 8, 4, 4); ctx.fillRect(p.x + p.width - 8, p.y + p.height - 8, 4, 4);

                ctx.fillStyle = '#c84c0c'; 
                ctx.fillRect(p.x + 10, p.y + 8, 12, 4); ctx.fillRect(p.x + 18, p.y + 12, 4, 6);
                ctx.fillRect(p.x + 14, p.y + 18, 4, 4); ctx.fillRect(p.x + 14, p.y + 24, 4, 4);
                
                ctx.fillStyle = '#fff'; 
                ctx.fillRect(p.x + 8, p.y + 6, 12, 4); ctx.fillRect(p.x + 16, p.y + 10, 4, 6);
                ctx.fillRect(p.x + 12, p.y + 16, 4, 4); ctx.fillRect(p.x + 12, p.y + 22, 4, 4);
            }
        } else if (p.type === 'moving') {
            ctx.fillStyle = '#ffd400'; ctx.fillRect(p.x, p.y, p.width, p.height); ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, p.y, p.width, p.height);
        } else if (p.type === 'gate' && !p.linked.hit) {
            ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(Date.now() / 150); ctx.fillStyle = '#b026ff'; ctx.fillRect(p.x, 0, p.width, canvas.height); ctx.restore();
        }
    });

    activeCoins.forEach(c => {
        ctx.save(); ctx.globalAlpha = Math.max(0, c.opacity); ctx.fillStyle = '#ffff00'; 
        ctx.beginPath(); ctx.ellipse(c.x + 8, c.y + 8, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#d69e00'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    });

    healthHearts.forEach(h => {
        if (h.collected) return;
        ctx.fillStyle = '#ff003c'; ctx.font = '24px Arial'; ctx.fillText('❤', h.x, h.y + 10 * Math.sin(Date.now() / 200)); 
    });
}

/* ============== UI VE CAN SİSTEMİ ============== */
function updateScore() { document.getElementById('score').innerText = String(score).padStart(6, '0'); }
function updateHeartsUI() { document.getElementById('hearts').innerText = '❤x' + player.lives; }

function fullRestart() {
    resetKeys(); player.lives = MAX_LIVES; player.x = 50; player.y = 50; player.vx = 0; player.vy = 0; player.isDead = false; player.levelFinished = false; isPaused = false; score = 0;
    currentLevelIndex = 1; globalQIndex = 0; initQuestions(); updateScore(); updateHeartsUI(); createLevel(); gameOverScreen.style.display = 'none'; startLevelTransition();
}

function winGame() {
    if (player.isDead) return; resetKeys(); player.isDead = true; 
    try { AudioEngine.fanfare(); } catch(e){}
    document.getElementById('go-title').innerText = "VEEE FİNAL! 💖\nTÜM SORULARI GEÇTİN!"; document.getElementById('go-title').style.color = "#00ff66"; document.getElementById('btn-restart').innerText = "SENİ ÇOK SEVİYORUM!"; gameOverScreen.style.display = 'flex';
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let targetCamX = player.x - canvas.width / 2 + player.width / 2; if (targetCamX < 0) targetCamX = 0;
    const maxCam = checkpoints.length ? checkpoints[checkpoints.length - 1].x + 400 - canvas.width / 2 : 0; if (targetCamX > maxCam) targetCamX = maxCam;
    cameraX = targetCamX;
    
    updateActiveCoins();
    
    ctx.save(); ctx.translate(-cameraX, 0); drawGame(); updateEnemies(); updateMovingPlatforms(); player.update(); player.draw(); ctx.restore();
    
    if (reqId) cancelAnimationFrame(reqId); reqId = requestAnimationFrame(animate);
}

initQuestions(); createLevel(); updateScore(); updateHeartsUI(); animate();
</script>
