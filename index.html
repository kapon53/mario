<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kapon | Zıplama Macerası</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        h1 {
            color: #ff003c;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 0, 60, 0.6);
            margin: 5px 0 15px 0;
            font-size: 2em;
        }

        #game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .info-box {
            background: #111;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
            font-weight: bold;
            flex: 1;
            margin: 0 5px;
        }

        .info-box span {
            color: #ff003c;
            font-size: 1.4em;
            display: block;
            margin-top: 2px;
        }

        #game-container {
            position: relative;
            background: #0a0a0c;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #1a1a1e;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.15);
        }

        canvas {
            /* Canvas'ın arkası siyah, içini JavaScript ile mavi boyayacağız */
            background-color: #000;
            border: 2px solid #333;
            border-radius: 8px;
            display: block;
        }

        #mobile-controls {
            margin-top: 15px;
            width: 100%;
            max-width: 400px;
        }

        .btn-jump {
            width: 100%;
            background: transparent;
            border: 3px solid #ff003c;
            color: #ff003c;
            font-size: 24px;
            padding: 20px 0;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.1s;
        }

        .btn-jump:active {
            background: #ff003c;
            color: #000;
            transform: scale(0.95);
            box-shadow: 0 0 20px #ff003c;
        }

        #game-over-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
        }

        #go-title {
            font-size: 3em;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px #ff003c;
            color: #ff003c;
        }

        .go-text {
            font-size: 1.5em;
            color: #fff;
            margin: 10px 0;
        }

        #btn-restart {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: #ff003c;
            background: transparent;
            border: 3px solid #ff003c;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        #btn-restart:hover, #btn-restart:active {
            background: #ff003c;
            color: #000;
            box-shadow: 0 0 25px #ff003c;
        }

        @media (max-width: 768px) {
            canvas {
                width: 100%;
                height: auto;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <h1>ZIPLAMA MACERASI</h1>

    <div id="game-info">
        <div class="info-box">Rekor <span id="high-score">0</span></div>
        <div class="info-box">Skor <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="300"></canvas>
    </div>

    <div id="mobile-controls">
        <button class="btn-jump" id="btn-jump">ZIIPLA! ⬆️</button>
    </div>

    <div id="game-over-screen">
        <h2 id="go-title">YANDIN!</h2>
        <p class="go-text">Skorun: <span id="final-score" style="color: #00f3ff; font-weight:bold;">0</span></p>
        <button id="btn-restart">TEKRAR DENE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');
        
        let frames = 0;
        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let reqId;
        
        // Rekor Sistemi
        let highScore = localStorage.getItem('marioHighScore') || 0;
        document.getElementById('high-score').innerText = highScore;

        // --- BULUTLAR (GÖKYÜZÜ İÇİN) ---
        const clouds = [];
        class Cloud {
            constructor() {
                this.x = canvas.width + Math.random() * 50;
                this.y = Math.random() * 100 + 20;
                this.size = Math.random() * 20 + 15;
                this.speed = Math.random() * 1 + 0.5;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.8, this.y - this.size * 0.4, this.size * 0.8, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 1.6, this.y, this.size * 0.9, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.x -= this.speed;
                this.draw();
            }
        }

        // --- KARAKTER (KODLA ÇİZİLMİŞ PİKSEL MARIO) ---
        const player = {
            x: 50,
            y: 200,
            width: 28,  // Karakter genişliği
            height: 38, // Karakter yüksekliği
            dy: 0,
            jumpForce: 12.5,
            gravity: 0.65,
            grounded: false,
            
            draw() {
                const px = this.x;
                const py = this.y;
                
                // Şapka (Kırmızı)
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(px + 4, py, 16, 6); // Üst kısım
                ctx.fillRect(px + 2, py + 6, 24, 4); // Siperlik
                
                // Yüz (Ten Rengi)
                ctx.fillStyle = '#ffcc99';
                ctx.fillRect(px + 6, py + 10, 18, 12);
                
                // Bıyık ve Burun
                ctx.fillStyle = '#3a200d'; // Koyu Kahverengi
                ctx.fillRect(px + 20, py + 14, 6, 6); // Burun
                ctx.fillRect(px + 18, py + 18, 10, 4); // Bıyık
                ctx.fillRect(px + 4, py + 10, 4, 8); // Favoriler / Saç
                
                // Göz
                ctx.fillStyle = '#000000';
                ctx.fillRect(px + 16, py + 12, 4, 4);
                
                // Vücut - Kırmızı Gömlek
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(px + 4, py + 22, 20, 10);
                
                // Vücut - Mavi Tulum
                ctx.fillStyle = '#0000ff';
                ctx.fillRect(px + 6, py + 26, 16, 12);
                ctx.fillRect(px + 6, py + 22, 4, 4); // Sol Askı
                ctx.fillRect(px + 18, py + 22, 4, 4); // Sağ Askı
                
                // Düğmeler (Sarı)
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(px + 6, py + 26, 3, 3);
                ctx.fillRect(px + 18, py + 26, 3, 3);
                
                // Ayakkabılar (Kahverengi) - Zıplarken bacaklar yukarı çekilir!
                ctx.fillStyle = '#5c3a21';
                if(this.grounded) {
                    ctx.fillRect(px + 2, py + 34, 10, 6); // Sol ayak yerde
                    ctx.fillRect(px + 16, py + 34, 10, 6); // Sağ ayak yerde
                } else {
                    ctx.fillRect(px + 2, py + 30, 10, 6); // Sol ayak havada
                    ctx.fillRect(px + 16, py + 30, 10, 6); // Sağ ayak havada
                }
            },
            
            update() {
                // Yerçekimi
                this.dy += this.gravity;
                this.y += this.dy;
                
                // Zemin kontrolü (Zemin 50px)
                if (this.y + this.height >= canvas.height - 50) {
                    this.y = canvas.height - 50 - this.height;
                    this.dy = 0;
                    this.grounded = true;
                } else {
                    this.grounded = false;
                }
                this.draw();
            },
            
            jump() {
                if (this.grounded) {
                    this.dy = -this.jumpForce;
                }
            }
        };

        // --- ENGELLER (BORULAR) ---
        const obstacles = [];
        class Obstacle {
            constructor() {
                this.width = 40;
                this.height = Math.random() * (120 - 50) + 50; 
                this.x = canvas.width;
                this.y = canvas.height - 50 - this.height;
            }
            
            draw() {
                // Klasik Mario yeşil borusu
                ctx.fillStyle = '#00aa00';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Borunun gölgelendirmesi/ışığı (3D efekti)
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x + 5, this.y, 10, this.height);
                
                // Borunun üst dudak kısmı
                ctx.fillStyle = '#00aa00';
                ctx.fillRect(this.x - 4, this.y, this.width + 8, 20);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x + 1, this.y, 10, 20);
                
                // Siyah ana hatlar (Çizgi roman tarzı belirginlik)
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y + 20, this.width, this.height - 20);
                ctx.strokeRect(this.x - 4, this.y, this.width + 8, 20);
            }
            
            update() {
                this.x -= gameSpeed;
                this.draw();
            }
        }

        function handleObstacles() {
            if (frames % 100 === 0) {
                obstacles.push(new Obstacle());
            }
            
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].update();
                
                // Çarpışma Kontrolü (Hassaslaştırıldı)
                if (
                    player.x + 4 < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width - 4 > obstacles[i].x &&
                    player.y + 4 < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    isGameOver = true;
                }
                
                // Boru geçildiğinde skor ver
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    i--;
                    
                    if(score % 50 === 0) {
                        gameSpeed += 0.5;
                    }
                }
            }
        }

        function handleClouds() {
            if (frames % 150 === 0) {
                clouds.push(new Cloud());
            }
            for (let i = 0; i < clouds.length; i++) {
                clouds[i].update();
                if (clouds[i].x + clouds[i].size * 3 < 0) {
                    clouds.splice(i, 1);
                    i--;
                }
            }
        }

        // --- GÖKYÜZÜ VE ZEMİN ---
        function drawBackground() {
            // Gökyüzü Gradyanı
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#5db1ff'); // Üstte koyu mavi
            grad.addColorStop(1, '#a1d6ff'); // Altta açık mavi
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawGround() {
            // Toprak Zemin
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // Üstteki Çim Katmanı
            ctx.fillStyle = '#228b22';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 15);
            
            // Çim ve toprak arasına ince siyah bir çizgi
            ctx.fillStyle = '#000';
            ctx.fillRect(0, canvas.height - 35, canvas.width, 2);
        }

        function animate() {
            if (isGameOver) {
                gameOver();
                return;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            handleClouds();
            drawGround();
            
            player.update();
            handleObstacles();
            
            frames++;
            reqId = requestAnimationFrame(animate);
        }

        function gameOver() {
            document.getElementById('final-score').innerText = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('marioHighScore', highScore);
                document.getElementById('high-score').innerText = highScore;
                document.getElementById('go-title').innerText = "YENİ REKOR!";
                document.getElementById('go-title').style.color = "#00ff66";
            } else {
                document.getElementById('go-title').innerText = "YANDIN!";
                document.getElementById('go-title').style.color = "#ff003c";
            }
            
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            player.y = 200;
            player.dy = 0;
            obstacles.length = 0;
            clouds.length = 0; // Bulutları sıfırla
            score = 0;
            frames = 0;
            gameSpeed = 5;
            isGameOver = false;
            document.getElementById('score').innerText = score;
            gameOverScreen.style.display = 'none';
            animate();
        }

        // Kontroller
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                player.jump();
            }
        });

        const jumpBtn = document.getElementById('btn-jump');
        jumpBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            player.jump();
        });
        
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            player.jump();
        });

        document.getElementById('btn-restart').addEventListener('click', resetGame);

        // Oyunu Başlat
        animate();
    </script>
</body>
</html>
