<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kapon | Bizim Hikaye</title>
    <style>
        body {
            background-color: #000; color: #fff;
            font-family: 'Press Start 2P', 'Segoe UI', monospace, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
            user-select: none; touch-action: none;
        }

        h1 { color: #ff003c; text-transform: uppercase; letter-spacing: 2px; margin: 5px 0 10px 0; font-size: 1.5em; text-shadow: 0 0 10px rgba(255, 0, 60, 0.6); }

        #game-container { position: relative; background: #0a0a0c; padding: 4px; border-radius: 8px; border: 2px solid #333; overflow: hidden; }

        canvas { background-color: #5c94fc; display: block; border-radius: 4px; image-rendering: pixelated; }

        #mobile-controls {
            display: flex; justify-content: space-between; width: 100%; max-width: 600px;
            margin-top: 20px; padding: 0 10px; box-sizing: border-box;
        }
        .d-pad { display: flex; gap: 15px; }
        .m-btn {
            background: rgba(255, 255, 255, 0.1); border: 2px solid #fff; color: #fff;
            font-size: 24px; width: 60px; height: 60px; border-radius: 50%;
            font-weight: bold; display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; touch-action: manipulation;
        }
        .m-btn:active { background: #fff; color: #000; transform: scale(0.9); }
        .btn-action { background: rgba(255, 0, 60, 0.2); border-color: #ff003c; color: #ff003c; width: 70px; height: 70px; }
        .btn-action:active { background: #ff003c; color: #fff; }

        #ui-layer {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; text-shadow: 2px 2px 0 #000; pointer-events: none;
        }

        /* YANDIN EKRANI */
        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center; border-radius: 8px; padding: 20px; box-sizing: border-box;
        }
        #go-title { font-size: 1.5em; margin: 0 0 15px 0; line-height: 1.4; color: #ff003c; text-shadow: 0 0 10px #ff003c; }
        #btn-restart {
            margin-top: 20px; padding: 12px 25px; font-size: 1em; font-weight: bold;
            background: #ff003c; color: #fff; border: 2px solid #fff; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        }

        /* SORU EKRANI */
        #quiz-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(43, 0, 82, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center; border-radius: 8px; padding: 20px; box-sizing: border-box;
        }
        #quiz-question { font-size: 1.1em; color: #fff; margin-bottom: 25px; line-height: 1.5; text-shadow: 0 0 10px #b026ff; }
        #quiz-options { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; }
        .quiz-opt-btn {
            background: #111; color: #b026ff; border: 2px solid #b026ff; padding: 15px; font-size: 0.95em;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit; line-height: 1.3;
        }
        .quiz-opt-btn:active { background: #b026ff; color: #fff; transform: scale(0.95); }

        @media (max-width: 768px) { canvas { width: 100%; height: auto; } }
    </style>
</head>
<body>

    <h1>BİZİM HİKAYE</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="ui-layer">
            <div>SKOR<br><span id="score">000000</span></div>
            <div>AŞK<br>100%</div>
        </div>
        
        <div id="game-over-screen">
            <h2 id="go-title">YANDIN!</h2>
            <button id="btn-restart">HATANI TELAFİ ET</button>
        </div>

        <div id="quiz-screen">
            <div id="quiz-question">Soru</div>
            <div id="quiz-options"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div class="m-btn" id="btn-left">◀</div>
            <div class="m-btn" id="btn-right">▶</div>
        </div>
        <div class="m-btn btn-action" id="btn-jump">B</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');
        const quizScreen = document.getElementById('quiz-screen');
        
        const keys = { right: false, left: false, up: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false;
        });

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');

        btnLeft.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.left = true; });
        btnLeft.addEventListener('pointerup', (e) => { e.preventDefault(); keys.left = false; });
        btnLeft.addEventListener('pointercancel', (e) => { e.preventDefault(); keys.left = false; });
        btnRight.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.right = true; });
        btnRight.addEventListener('pointerup', (e) => { e.preventDefault(); keys.right = false; });
        btnRight.addEventListener('pointercancel', (e) => { e.preventDefault(); keys.right = false; });
        btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.up = true; });
        btnJump.addEventListener('pointerup', (e) => { e.preventDefault(); keys.up = false; });
        btnJump.addEventListener('pointercancel', (e) => { e.preventDefault(); keys.up = false; });

        let score = 0;
        let cameraX = 0;
        let isGameOver = false;
        let isPaused = false;
        let reqId;

        // ==========================================
        // İREM VE KEREM'İN ÖZEL SORU HAVUZU (13 SORU)
        // ==========================================
        const questionsData = [
            {
                q: "Sana resmi olarak ilk aşkım dediğim tarih?",
                options: ["14 Şubat", "13 Mart", "1 Nisan"],
                correct: 1, 
                failMsg: "İnanmıyorum... İlk aşkım dediğim günü nasıl unutursun! 💔 Başa dön!"
            },
            {
                q: "Tartıştığımızda genellikle kim haklı olur? 🙄",
                options: ["Ben (Kerem)", "Sen (İrem) 💅", "İkimiz de"],
                correct: 1,
                failMsg: "Yanlış cevap! İkimiz de biliyoruz ki daima sen haklısın! 😂 Başa dön!"
            },
            {
                q: "Kim daha düşürücü? 🫠",
                options: ["Ben (Kerem) 😎", "Sen (İrem)", "Ortak"],
                correct: 0,
                failMsg: "Emin misin? Bence bir daha düşün... 😉 Başa dön!"
            },
            {
                q: "Kim daha uykucu?",
                options: ["Ben (Kerem)", "Sen (İrem) 😴", "Uyku da neymiş?"],
                correct: 1,
                failMsg: "Hadi ama, uykucu şirin kim biliyoruz... 😴 Başa dön!"
            },
            {
                q: "Kim daha çok seven kişinin PLANLARINI BOZUYOR????????? 🤔🧐",
                options: ["Ben (Kerem)", "Sen (İrem) 🫣", "Kader diyelim"],
                correct: 1,
                failMsg: "İtiraf etsene planları kim bozuyor! 🧐 Başa dön!"
            },
            {
                q: "Sana aşkım deyip korktuğum tarih?",
                options: ["13 Mart", "1 Nisan", "14 Şubat"],
                correct: 2,
                failMsg: "Korkudan titrediğim o günü nasıl bilmezsin! 😱 Başa dön!"
            },
            {
                q: "Göndermelerin olduğu tartışma tarihi?",
                options: ["- (Böyle bir tarih yok)", "10 Mayıs", "30 Şubat"],
                correct: 0,
                failMsg: "O kadar gönderme boşa mı gitti yani? 🙄 Tekrar başla!"
            },
            {
                q: "WP'ye geçtiğimiz tarih?",
                options: ["1 Nisan", "14 Şubat", "13 Mart"],
                correct: 0,
                failMsg: "O tarihi bileceksin... O kadar heyecanlanmıştık! 😤 Başa dön."
            },
            {
                q: "Kim numaralaşmak istedi? 🙄🫣 (DÜNYANIN EN UTANÇ ANI)",
                options: ["Sen (İrem)", "Ben (Kerem) 🫣", "Telepati ile numaralaştık"],
                correct: 1,
                failMsg: "O utanç anını başkasına yıkamazsın! 🫣 Başa dön!"
            },
            {
                q: "Benim çok sevip (fav değil) senin HİÇ sevmediğin yemek?",
                options: ["Kuru Fasulye", "Nohut", "Ispanak"],
                correct: 1,
                failMsg: "Nasıl sevmezsin nohutu ya... Bilemedin, başa dön! 😡"
            },
            {
                q: "Senin bayıla bayıla yediğin, benim nefret ettiğim o 'Gıda Katliamı' yemek? 🤢🤮",
                options: ["Bol Soslu Döner", "Islak Hamburger", "Ananaslı Pizza"],
                correct: 0,
                failMsg: "O soslu döneri midesi alan tek kişi sensin... Nasıl unutursun! 🤮 Başa dön!"
            },
            {
                q: "Kurgu yaptığımızda çıktığımız date'de sen hangi tatlıyı yedin?",
                options: ["Sütlaç", "Kazandibi", "Fıstık Sarma"],
                correct: 2,
                failMsg: "Yediğin fıstık sarmayı bile unuttun mu? İnanılmaz... 🍰 Başa dön!"
            },
            {
                q: "Benim en nefret ettiğim kişi (sen bayılırsın bu kişiye) 😡😡",
                options: ["Fatih", "Ahmet", "Mehmet"],
                correct: 0,
                failMsg: "O isme tahammülüm yok, cevabı nasıl bilemezsin! 😡😡😡 Başa dön!"
            }
        ];
        let currentQuizBlock = null;

        // --- OYUNCU (KARAKTER FİZİĞİ VE ÇİZİMİ) ---
        const player = {
            x: 50, y: 50, width: 24, height: 32,
            vx: 0, vy: 0, speed: 4.5, jumpPower: -12, gravity: 0.65,
            grounded: false, isDead: false,

            update() {
                if(this.isDead || isPaused) return;

                if (keys.right) this.vx = this.speed;
                else if (keys.left) this.vx = -this.speed;
                else this.vx = 0; 

                if (keys.up && this.grounded) {
                    this.vy = this.jumpPower;
                    this.grounded = false;
                }

                this.vy += this.gravity;
                this.x += this.vx;
                if(this.x < 0) this.x = 0; 
                this.checkCollisions('x');

                this.y += this.vy;
                this.grounded = false; 
                this.checkCollisions('y');

                // Düşman Çarpışması
                for (let i = 0; i < enemies.length; i++) {
                    let e = enemies[i];
                    if (e.alive && 
                        this.x < e.x + e.width && this.x + this.width > e.x &&
                        this.y < e.y + e.height && this.y + this.height > e.y) {
                        
                        if (this.vy > 0 && this.y + this.height - this.vy <= e.y + 10) {
                            e.alive = false;
                            this.vy = -7; 
                            score += 100;
                            updateScore();
                        } else {
                            die("Goomba'ya çarptın! Baştan..."); 
                        }
                    }
                }

                // 13 soruyu bitirip sona ulaşma
                if (this.x >= 12500) winGame(); 
                if (this.y > canvas.height + 100) die("ÇUKURA DÜŞTÜN! 😱 Başa dön...");
            },

            checkCollisions(axis) {
                for (let i = 0; i < platforms.length; i++) {
                    let p = platforms[i];
                    if (this.x < p.x + p.width && this.x + this.width > p.x &&
                        this.y < p.y + p.height && this.y + this.height > p.y) {
                        
                        if (axis === 'x') {
                            if (this.vx > 0) this.x = p.x - this.width;
                            else if (this.vx < 0) this.x = p.x + p.width;
                            this.vx = 0;
                        } else if (axis === 'y') {
                            if (this.vy > 0) { 
                                this.y = p.y - this.height;
                                this.grounded = true;
                            } else if (this.vy < 0) {
                                this.y = p.y + p.height;
                                if(p.type === 'quizblock' && !p.hit) {
                                    triggerQuiz(p);
                                }
                            }
                            this.vy = 0;
                        }
                    }
                }
            },

            draw() {
                if(this.isDead) return;
                ctx.fillStyle = '#f83800'; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#ffcc99'; 
                ctx.fillRect(this.x + (this.vx < 0 ? 0 : 8), this.y + 4, 16, 12);
                ctx.fillStyle = '#0000ff'; 
                ctx.fillRect(this.x + 4, this.y + 16, 16, 12);
            }
        };

        const platforms = [];
        const enemies = [];
        
        // --- HARİTA VE RASTGELE SORU DAĞILIMI ---
        function createLevel() {
            platforms.length = 0;
            enemies.length = 0;

            // Soruların indekslerini karıştır (Random Shuffle Algoritması)
            let shuffledQuestionIndices = [];
            for (let i = 0; i < questionsData.length; i++) {
                shuffledQuestionIndices.push(i);
            }
            for (let i = shuffledQuestionIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledQuestionIndices[i], shuffledQuestionIndices[j]] = [shuffledQuestionIndices[j], shuffledQuestionIndices[i]];
            }

            let currentX = 0;
            
            for(let i = 0; i < 13; i++) {
                // Zemin
                platforms.push({ x: currentX, y: 350, width: 700, height: 50, type: 'ground' });
                
                // Karıştırılmış listeden rastgele soruyu bloğa ata
                platforms.push({ x: currentX + 350, y: 200, width: 32, height: 32, type: 'quizblock', hit: false, qIndex: shuffledQuestionIndices[i] });
                
                // Süs Tuğlalar
                platforms.push({ x: currentX + 318, y: 200, width: 32, height: 32, type: 'brick' });
                platforms.push({ x: currentX + 382, y: 200, width: 32, height: 32, type: 'brick' });

                // Düşman (Goomba)
                enemies.push({ x: currentX + 500, y: 326, width: 24, height: 24, minX: currentX + 400, maxX: currentX + 650, vx: -1.5, alive: true });
                
                // Bir sonraki adaya geçiş (200px uçurum boşluğu)
                currentX += 900; 
            }

            // Bitiş Zemini
            platforms.push({ x: currentX, y: 350, width: 1000, height: 50, type: 'ground' });
        }

        function updateEnemies() {
            if(isPaused) return;
            enemies.forEach(e => {
                if (e.alive) {
                    e.x += e.vx;
                    if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1; 
                }
            });
        }

        function triggerQuiz(blockInfo) {
            isPaused = true; 
            currentQuizBlock = blockInfo; 
            
            const quizData = questionsData[blockInfo.qIndex];
            // Soru numarasını (1), 2) vs) temizleyip dinamik numara eklemek istersen burada yapabiliriz ama böyle saf da çok güzel durur.
            document.getElementById('quiz-question').innerText = quizData.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = ''; 
            
            quizData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-opt-btn';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(index, quizData.correct, quizData.failMsg);
                optionsContainer.appendChild(btn);
            });
            
            quizScreen.style.display = 'flex'; 
        }

        function checkAnswer(selectedIndex, correctIndex, failMessage) {
            quizScreen.style.display = 'none'; 
            
            if (selectedIndex === correctIndex) {
                currentQuizBlock.hit = true; 
                score += 500; 
                updateScore();
                isPaused = false; 
            } else {
                isPaused = false;
                die(failMessage); 
            }
        }

        function drawGame() {
            // Arka Plan Süsleri
            ctx.fillStyle = '#fff';
            for(let i=0; i<30; i++) {
                ctx.fillRect(150 + i*500, 80, 60, 20);
                ctx.fillRect(160 + i*500, 60, 40, 20);
                ctx.fillRect(350 + i*500, 50, 80, 25);
                ctx.fillRect(370 + i*500, 30, 40, 20);
            }

            // Bitiş Bayrağı
            ctx.fillStyle = '#fff';
            ctx.fillRect(12500, 50, 4, 300); 
            ctx.fillStyle = '#00a800';
            ctx.fillRect(12494, 42, 16, 16); 
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(12504, 60); ctx.lineTo(12540, 75); ctx.lineTo(12504, 90); ctx.fill(); 
            
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = '#c84c0c'; ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#000'; ctx.fillRect(p.x, p.y, p.width, 2); 
                } 
                else if (p.type === 'brick') {
                    ctx.fillStyle = '#c84c0c'; ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, p.y, p.width, p.height);
                }
                else if (p.type === 'quizblock') {
                    ctx.fillStyle = p.hit ? '#c84c0c' : '#b026ff';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = '#000'; ctx.strokeRect(p.x, p.y, p.width, p.height);
                    if(!p.hit) { 
                        ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; 
                        ctx.fillText('?', p.x + 10, p.y + 24); 
                    }
                }
            });

            enemies.forEach(e => {
                if(e.alive) {
                    ctx.fillStyle = '#8b4513'; ctx.fillRect(e.x, e.y, e.width, e.height);
                    ctx.fillStyle = '#ffcc99'; ctx.fillRect(e.x, e.y+20, 8, 4); ctx.fillRect(e.x+16, e.y+20, 8, 4);
                    ctx.fillStyle = '#fff'; ctx.fillRect(e.x+4, e.y+6, 6, 8); ctx.fillRect(e.x+14, e.y+6, 6, 8);
                    ctx.fillStyle = '#000'; ctx.fillRect(e.x+6, e.y+10, 2, 2); ctx.fillRect(e.x+16, e.y+10, 2, 2);
                }
            });
        }

        function updateScore() {
            document.getElementById('score').innerText = String(score).padStart(6, '0');
        }

        function die(reason) {
            if(player.isDead) return;
            player.isDead = true;
            document.getElementById('go-title').innerText = reason; 
            document.getElementById('go-title').style.color = "#ff003c";
            document.getElementById('btn-restart').innerText = "HATANI TELAFİ ET";
            gameOverScreen.style.display = 'flex';
        }

        function winGame() {
            if(player.isDead) return;
            player.isDead = true; 
            document.getElementById('go-title').innerText = "VEEE FİNAL! 💖\nTÜM SORULARI GEÇTİN!";
            document.getElementById('go-title').style.color = "#00ff66";
            document.getElementById('btn-restart').innerText = "SENİ ÇOK SEVİYORUM!";
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            player.x = 50; player.y = 50; player.vx = 0; player.vy = 0;
            player.isDead = false;
            isPaused = false;
            score = 0;
            updateScore();
            createLevel();
            gameOverScreen.style.display = 'none';
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            if(document.getElementById('btn-restart').innerText === "SENİ ÇOK SEVİYORUM!") {
                // Kazandıktan sonra butona basarsa hiçbir şey yapma (ekranda kalsın)
            } else {
                restartGame();
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let targetCamX = player.x - canvas.width / 2 + player.width / 2;
            if (targetCamX < 0) targetCamX = 0;
            if (targetCamX > 12200) targetCamX = 12200; 
            cameraX = targetCamX;

            ctx.save();
            ctx.translate(-cameraX, 0);

            drawGame();
            updateEnemies();
            player.update();
            player.draw();

            ctx.restore();

            if(!isGameOver) reqId = requestAnimationFrame(animate);
        }

        createLevel();
        animate();

    </script>
</body>
</html>
