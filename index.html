<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kapon | Süper Platformer</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', 'Segoe UI', monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
        }

        h1 {
            color: #ff003c;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 5px 0 10px 0;
            font-size: 1.5em;
        }

        #game-container {
            position: relative;
            background: #0a0a0c;
            padding: 4px;
            border-radius: 8px;
            border: 2px solid #333;
        }

        canvas {
            background-color: #5c94fc; /* Tam görseldeki Mario mavisi */
            display: block;
            border-radius: 4px;
            image-rendering: pixelated; /* Retro piksel görünümü */
        }

        /* MOBİL KONTROLLER (Arcade Tarzı) */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .d-pad {
            display: flex;
            gap: 15px;
        }

        .m-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            color: #fff;
            font-size: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }

        .m-btn:active {
            background: #fff;
            color: #000;
            transform: scale(0.9);
        }

        .btn-action {
            background: rgba(255, 0, 60, 0.2);
            border-color: #ff003c;
            color: #ff003c;
            width: 70px;
            height: 70px;
        }

        .btn-action:active {
            background: #ff003c;
            color: #fff;
        }

        /* BİLGİ EKRANI */
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <h1>SÜPER KAPON</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="ui-layer">
            <div>SKOR<br><span id="score">000000</span></div>
            <div>DÜNYA<br>1-1</div>
        </div>
    </div>

    <!-- MOBİL İÇİN KONTROL BUTONLARI -->
    <div id="mobile-controls">
        <div class="d-pad">
            <div class="m-btn" id="btn-left">◀</div>
            <div class="m-btn" id="btn-right">▶</div>
        </div>
        <div class="m-btn btn-action" id="btn-jump">B</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- KLAVYE/BUTON DURUMLARI ---
        const keys = { right: false, left: false, up: false };

        // Klavye dinleyicileri
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false;
        });

        // Mobil Buton Dinleyicileri
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');

        btnLeft.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.left = true; });
        btnLeft.addEventListener('pointerup', (e) => { e.preventDefault(); keys.left = false; });
        btnLeft.addEventListener('pointercancel', (e) => { e.preventDefault(); keys.left = false; });

        btnRight.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.right = true; });
        btnRight.addEventListener('pointerup', (e) => { e.preventDefault(); keys.right = false; });
        btnRight.addEventListener('pointercancel', (e) => { e.preventDefault(); keys.right = false; });

        btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.up = true; });
        btnJump.addEventListener('pointerup', (e) => { e.preventDefault(); keys.up = false; });
        btnJump.addEventListener('pointercancel', (e) => { e.preventDefault(); keys.up = false; });

        // --- OYUN DEĞİŞKENLERİ ---
        let score = 0;
        let cameraX = 0;

        // --- OYUNCU (PLAYER) ---
        const player = {
            x: 50,
            y: 50,
            width: 24,
            height: 32,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpPower: -11.5,
            gravity: 0.6,
            grounded: false,

            update() {
                // Sağa Sola Hareket
                if (keys.right) this.vx = this.speed;
                else if (keys.left) this.vx = -this.speed;
                else this.vx = 0; // Kayma yok, anında durur

                // Zıplama
                if (keys.up && this.grounded) {
                    this.vy = this.jumpPower;
                    this.grounded = false;
                }

                // Yerçekimi
                this.vy += this.gravity;

                // X Ekseni Hareketi ve Çarpışması
                this.x += this.vx;
                this.checkCollisions('x');

                // Ekranın en solundan dışarı çıkmayı engelle
                if(this.x < 0) this.x = 0; 

                // Y Ekseni Hareketi ve Çarpışması
                this.y += this.vy;
                this.grounded = false; // Varsayılan olarak havada kabul et
                this.checkCollisions('y');

                // Ölüm kontrolü (Boşluğa düşerse)
                if (this.y > canvas.height + 100) {
                    restartGame();
                }
            },

            checkCollisions(axis) {
                for (let i = 0; i < platforms.length; i++) {
                    let p = platforms[i];
                    // Basit AABB (Kutu) Çarpışma Tespiti
                    if (this.x < p.x + p.width &&
                        this.x + this.width > p.x &&
                        this.y < p.y + p.height &&
                        this.y + this.height > p.y) {
                        
                        // Hangi eksende çarpıştığını bul ve düzelt
                        if (axis === 'x') {
                            if (this.vx > 0) this.x = p.x - this.width; // Sağa çarpma
                            else if (this.vx < 0) this.x = p.x + p.width; // Sola çarpma
                            this.vx = 0;
                        } else if (axis === 'y') {
                            if (this.vy > 0) { 
                                // Yere basma
                                this.y = p.y - this.height;
                                this.grounded = true;
                            } else if (this.vy < 0) {
                                // Kafayı bloğa vurma (Blok kırma efekti eklenebilir)
                                this.y = p.y + p.height;
                                if(p.type === 'qblock' && !p.hit) {
                                    p.hit = true;
                                    score += 100;
                                    updateScore();
                                }
                            }
                            this.vy = 0;
                        }
                    }
                }
            },

            draw() {
                // Görseldeki gibi piksel karakter (basitleştirilmiş)
                ctx.fillStyle = '#f83800'; // Kırmızı gömlek
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                ctx.fillStyle = '#ffcc99'; // Yüz
                ctx.fillRect(this.x + (this.vx < 0 ? 0 : 8), this.y + 4, 16, 12);
                
                ctx.fillStyle = '#0000ff'; // Mavi Tulum
                ctx.fillRect(this.x + 4, this.y + 16, 16, 12);
            }
        };

        // --- PLATFORMLAR VE HARİTA TASARIMI ---
        const platforms = [];
        
        function createLevel() {
            platforms.length = 0;
            // 1. Zemin Parçası
            platforms.push({ x: 0, y: 350, width: 900, height: 50, type: 'ground' });
            // 2. Boru
            platforms.push({ x: 300, y: 280, width: 50, height: 70, type: 'pipe' });
            // 3. Çukurdan sonraki zemin
            platforms.push({ x: 1000, y: 350, width: 800, height: 50, type: 'ground' });
            
            // Havada asılı bloklar (Attığın görseldeki dizilim)
            platforms.push({ x: 450, y: 200, width: 32, height: 32, type: 'brick' });
            platforms.push({ x: 482, y: 200, width: 32, height: 32, type: 'qblock', hit: false });
            platforms.push({ x: 514, y: 200, width: 32, height: 32, type: 'brick' });
            platforms.push({ x: 546, y: 200, width: 32, height: 32, type: 'qblock', hit: false });
            platforms.push({ x: 578, y: 200, width: 32, height: 32, type: 'brick' });
        }

        // Platformları Çizme Fonksiyonu
        function drawPlatforms() {
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = '#c84c0c'; // Tuğla turuncusu
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    // Basit tuğla çizgileri
                    ctx.fillStyle = '#000';
                    ctx.fillRect(p.x, p.y, p.width, 2); 
                } 
                else if (p.type === 'pipe') {
                    ctx.fillStyle = '#00a800'; // Boru yeşili
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#000';
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    // Boru başlığı
                    ctx.fillRect(p.x - 4, p.y, p.width + 8, 24);
                    ctx.strokeRect(p.x - 4, p.y, p.width + 8, 24);
                }
                else if (p.type === 'brick') {
                    ctx.fillStyle = '#c84c0c';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = '#000';
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                }
                else if (p.type === 'qblock') {
                    ctx.fillStyle = p.hit ? '#c84c0c' : '#fc9838'; // Vurulduysa söner
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = '#000';
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                    if(!p.hit) {
                        ctx.fillStyle = '#000';
                        ctx.font = '20px monospace';
                        ctx.fillText('?', p.x + 10, p.y + 24);
                    }
                }
            });
        }

        // --- BULUTLAR ---
        function drawDecorations() {
            ctx.fillStyle = '#fff';
            // Bulut 1
            ctx.fillRect(150, 80, 60, 20);
            ctx.fillRect(160, 60, 40, 20);
            // Bulut 2
            ctx.fillRect(500, 50, 80, 25);
            ctx.fillRect(520, 30, 40, 20);
        }

        // --- OYUN DÖNGÜSÜ (GAME LOOP) ---
        function updateScore() {
            document.getElementById('score').innerText = String(score).padStart(6, '0');
        }

        function restartGame() {
            player.x = 50;
            player.y = 50;
            player.vx = 0;
            player.vy = 0;
            score = 0;
            updateScore();
            createLevel();
        }

        function animate() {
            // Arka planı temizle (Gökyüzü rengi CSS'ten geliyor ama canvas temizlenmeli)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // KAMERA TAKİBİ (Karakter sağa gittikçe ekranı kaydır)
            // Karakter ekranın ortasını geçerse kamera onu takip eder
            let targetCamX = player.x - canvas.width / 2 + player.width / 2;
            if (targetCamX < 0) targetCamX = 0; // En sola gitmeyi engelle
            cameraX = targetCamX;

            ctx.save();
            ctx.translate(-cameraX, 0); // Dünyayı kameraya göre kaydır

            drawDecorations();
            drawPlatforms();
            
            player.update();
            player.draw();

            ctx.restore();

            requestAnimationFrame(animate);
        }

        // Oyunu Başlat
        createLevel();
        animate();

    </script>
</body>
</html>
