<DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Kapon | Bizim Hikaye</title>
<style>
  :root{--bg:#000;--panel:!#0a0a0c;--accent:#ff003c;--purple:#b026ff;--gold:#ffd400}
  html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:'Press Start 2P','Segoe UI',monospace,serif}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;min-height:100vh;box-sizing:border-box}
  h1{color:var(--accent);letter-spacing:2px;margin:6px 0 12px 0;font-size:1.4rem;text-shadow:0 0 8px rgba(255,0,60,0.6)}
  #game-container{position:relative;background:var(--panel);padding:6px;border-radius:10px;border:2px solid #222;overflow:hidden;max-width:95vw}
  canvas{display:block;border-radius:6px;background:#5c94fc;image-rendering:pixelated}
  /* UI */
  #ui-layer{position:absolute;top:12px;left:12px;right:120px;display:flex;justify-content:space-between;pointer-events:none;font-weight:bold;font-size:13px;text-shadow:2px 2px 0 #000}
  .stat{line-height:1.1}
  #progress-wrap{display:flex;flex-direction:column;align-items:flex-end}
  #progress-label{color:var(--gold)}
  #hearts{color:var(--accent);font-size:14px;letter-spacing:2px}
  /* mute - aligned top-right to avoid overlap */
  #mute-btn{position:absolute;top:10px;right:12px;z-index:600;pointer-events:auto;cursor:pointer;background:rgba(0,0,0,0.45);border:2px solid #fff;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
  /* overlays */
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;border-radius:8px;text-align:center}
  #start-screen{background:linear-gradient(rgba(26,0,51,0.28),rgba(0,0,0,0.22));z-index:900;display:flex;flex-direction:column}
  #start-title{color:var(--accent);font-size:1.5rem;text-shadow:0 0 12px var(--accent);margin-bottom:8px}
  .game-btn{margin-top:10px;padding:10px 20px;font-weight:bold;background:var(--accent);color:#fff;border:2px solid #fff;border-radius:8px;cursor:pointer;text-transform:uppercase}
  #life-lost-screen{background:rgba(80,0,0,0.88);z-index:850;display:flex;flex-direction:column}
  #game-over-screen{background:rgba(0,0,0,0.92);z-index:950;display:flex;flex-direction:column}
  #quiz-screen{background:rgba(43,0,82,0.96);z-index:1000;display:flex;flex-direction:column}
  #quiz-input{padding:10px;border-radius:8px;border:2px solid var(--purple);background:#111;color:#fff;outline:none;width:70%;max-width:300px;text-align:center;font-weight:bold}
  /* mobile controls */
  #mobile-controls{display:flex;justify-content:space-between;width:100%;max-width:760px;margin-top:18px;padding:0 10px;box-sizing:border-box}
  .d-pad{display:flex;gap:12px}
  .m-btn{background:rgba(255,255,255,0.08);border:2px solid #fff;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;user-select:none}
  .btn-action{width:70px;height:70px;background:rgba(255,0,60,0.14);border-color:var(--accent);color:var(--accent)}
  .m-btn:active,.game-btn:active{transform:scale(0.96)}
  @media (max-width:768px){canvas{width:100%;height:auto}}
</style>
</head>
<body>
<div class="wrap">
  <h1>BİZİM HİKAYE</h1>

  <div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="ui-layer">
      <div class="stat">SKOR<br><span id="score">000000</span></div>
      <div id="progress-wrap" class="stat">
        <div id="progress-label">BÖLÜM 1/20</div>
        <div id="hearts">❤❤❤</div>
      </div>
    </div>

    <div id="mute-btn" title="Sessiz / Aç">🔊</div>

    <div id="start-screen" class="overlay">
      <div id="start-title">BİZİM HİKAYE</div>
      <div style="color:#b026ff;font-size:13px;max-width:80%;">Aramızdaki anıları hatırlayarak ilerle.<br>Mor kutulara çarpıp soruları doğru cevapla — 3 canın var. Coin topla, parkur uzunlaştı, daha zor düşmanlar eklendi.</div>
      <button id="start-btn" class="game-btn">BAŞLA ▶</button>
    </div>
