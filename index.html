<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kapon | Bizim Hikaye</title>
<style>
    body {
        background-color: #000; color: #fff;
        font-family: 'Press Start 2P', 'Segoe UI', monospace, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
        user-select: none; touch-action: none;
        overflow: hidden;
    }
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    #game-container { position: relative; background: #0a0a0c; padding: 4px; border-radius: 8px; border: 2px solid #333; overflow: hidden; }
    canvas { background-color: #5c94fc; display: block; border-radius: 4px; image-rendering: pixelated; touch-action: none; }

    #mobile-controls { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-top: 20px; padding: 0 10px; box-sizing: border-box; }
    .d-pad { display: flex; gap: 10px; }
    .m-btn {
        background: rgba(255, 255, 255, 0.1); border: 2px solid #fff; color: #fff;
        font-size: 20px; width: 55px; height: 55px; border-radius: 50%;
        font-weight: bold; display: flex; align-items: center; justify-content: center;
        cursor: pointer; user-select: none; touch-action: manipulation;
    }
    .m-btn:active { background: #fff; color: #000; transform: scale(0.9); }
    .btn-action { background: rgba(255, 0, 60, 0.2); border-color: #ff003c; color: #ff003c; width: 65px; height: 65px; font-size: 24px;}
    .btn-action:active { background: #ff003c; color: #fff; }

    #ui-layer {
        position: absolute; top: 15px; left: 20px; right: 20px;
        display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;
        text-shadow: 2px 2px 0 #000; pointer-events: none; text-align: center;
    }
    .ui-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }

    #settings-btn {
        position: absolute; top: 15px; right: 15px; pointer-events: auto; cursor: pointer;
        background: rgba(0,0,0,0.5); border: 2px solid #fff; color: #fff; border-radius: 50%;
        width: 35px; height: 35px; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 600;
    }

    #game-over-screen, #quiz-screen, #start-screen, #life-lost-screen, #level-start-screen, #level-complete-screen, #settings-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 8px; padding: 20px; box-sizing: border-box; text-align: center;
    }
    
    #settings-screen { background: rgba(0,0,0,0.95); z-index: 4000; }
    .setting-row { margin: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; }
    input[type=range] { width: 200px; accent-color: #ff003c; }

    #level-start-screen { background: #000; z-index: 2500; }
    #level-complete-screen { background: rgba(0,0,0,0.9); z-index: 2500; }
    #game-over-screen { background: rgba(0, 0, 0, 0.92); z-index: 1000; white-space: pre-line; }
    #go-title { font-size: 1.4em; margin: 0 0 15px 0; line-height: 1.4; color: #ff003c; text-shadow: 0 0 10px #ff003c; }

    #life-lost-screen { background: rgba(0, 0, 0, 0.95); z-index: 950; white-space: pre-line; }
    #ll-title { font-size: 1.2em; margin: 0 0 10px 0; line-height: 1.4; color: #ff5c5c; }
    #ll-sub { font-size: 0.8em; margin-bottom: 20px; color: #fff; }

    button.game-btn {
        margin-top: 10px; padding: 12px 25px; font-size: 1em; font-weight: bold;
        background: #ff003c; color: #fff; border: 2px solid #fff; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        font-family: 'Press Start 2P', monospace;
    }
    button.game-btn:active { transform: scale(0.95); }

    #quiz-screen { background: rgba(43, 0, 82, 0.96); z-index: 2000; }
    #quiz-question { font-size: 1.05em; color: #fff; margin-bottom: 25px; line-height: 1.5; text-shadow: 0 0 10px #b026ff; }
    #quiz-input {
        width: 80%; max-width: 300px; padding: 12px; font-size: 16px; font-weight: bold;
        border: 2px solid #b026ff; border-radius: 8px; background: #111; color: #fff;
        text-align: center; outline: none; margin-bottom: 20px; font-family: sans-serif;
    }
    #quiz-input:focus { box-shadow: 0 0 15px #b026ff; }
    #quiz-submit { background: #b026ff; color: #fff; border: 2px solid #fff; padding: 12px 30px; font-size: 1em; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: 'Press Start 2P', monospace;}
    
    #start-screen { background: #000; z-index: 3000; display: flex; }
    #start-title { color: #ff003c; font-size: 1.6em; text-shadow: 0 0 15px #ff003c; margin-bottom: 10px; }
    #start-sub { color: #fff; font-size: 0.7em; margin-bottom: 25px; line-height: 1.8; max-width: 80%; }
    #start-btn { background: #00c853; padding: 14px 30px; font-size: 1.1em; border-color: #fff; margin-bottom: 10px; }

    @media (max-width: 768px) { canvas { width: 100%; height: auto; } #ui-layer { font-size: 10px; } }
</style>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="ui-layer">
        <div class="ui-col"><span>İREM</span><span id="score">000000</span></div>
        <div class="ui-col"><span>🪙</span><span id="coins">x000</span></div>

</div>

<div id="mobile-controls">
    <div class="d-pad">
        <div class="m-btn" id="btn-left">◀</div>
        <div class="m-btn" id="btn-down" style="background: rgba(255, 212, 0, 0.2); border-color:#ffd400;">▼</div>
        <div class="m-btn" id="btn-right">▶</div>

    <div style="display:flex; gap:10px;">
        <div class="m-btn btn-action" id="btn-fire" style="display:none; background: rgba(255,106,0,0.25); border-color:#ff6a00; color:#ff6a00;">🔥</div>

<script>
const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
const gameOverScreen = document.getElementById('game-over-screen'); const lifeLostScreen = document.getElementById('life-lost-screen');
const startScreen = document.getElementById('start-screen'); const quizScreen = document.getElementById('quiz-screen');
const levelStartScreen = document.getElementById('level-start-screen'); const levelCompleteScreen = document.getElementById('level-complete-screen');
const settingsScreen = document.getElementById('settings-screen'); const quizInput = document.getElementById('quiz-input');

const SEGMENT_WIDTH = 1130; 
const MAX_LIVES = 3;

let currentLevelIndex = 1; 
const questionsPerLevel = [3, 3, 3, 4]; 
let globalQIndex = 0; 

function trackForLevel(idx) { return ['overworld', 'night', 'underground', 'castle'][(idx - 1) % 4] || 'overworld'; }

/* ============== SES VE MÜZİK MOTORU ============== */
const AudioEngine = {
    ctx: null, masterSfx: null, masterMusic: null,
    sfxVol: 0.5, musicVol: 0.2,
    init() {
        if (this.ctx) return;
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return; 
            this.ctx = new AudioCtx();
            this.masterSfx = this.ctx.createGain(); this.masterSfx.gain.value = this.sfxVol; this.masterSfx.connect(this.ctx.destination);
            this.masterMusic = this.ctx.createGain(); this.masterMusic.gain.value = this.musicVol; this.masterMusic.connect(this.ctx.destination);
        } catch (e) {}
    },
    updateVolumes() {
        if (this.masterSfx) this.masterSfx.gain.value = this.sfxVol;
        if (this.masterMusic) this.masterMusic.gain.value = this.musicVol;
    },
    tone(freq, dur, type = 'square', vol = 1, delay = 0) {
        if (!this.ctx) return; 
        try {
            const t0 = this.ctx.currentTime + delay; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, t0); gain.gain.setValueAtTime(vol, t0); gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(gain); gain.connect(this.masterSfx); osc.start(t0); osc.stop(t0 + dur + 0.02);
        } catch(e) {}
    },
    toneAt(freq, dur, type, vol, time) {
        if (!this.ctx || !freq) return;
        try {
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, time); gain.gain.setValueAtTime(vol, time); gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
            osc.connect(gain); gain.connect(this.masterMusic); osc.start(time); osc.stop(time + dur + 0.02);
        } catch(e) {}
    },
    noteFreq(note) {
        if (!note) return 0;
        const map = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
        const m = note.match(/^([A-G]#?)(\d)$/); if (!m) return 0;
        const midi = (parseInt(m[2]) + 1) * 12 + map[m[1]]; return 440 * Math.pow(2, (midi - 69) / 12);
    },
    jump() { this.tone(520, 0.12, 'square', 0.5); this.tone(780, 0.1, 'square', 0.3, 0.05); },
    stomp() { this.tone(180, 0.15, 'square', 0.6); },
    correct() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.15, 'square', 0.5, i * 0.09)); },
    wrong() { this.tone(200, 0.3, 'sawtooth', 0.5); this.tone(150, 0.35, 'sawtooth', 0.4, 0.1); },
    lifeLost() { this.tone(300, 0.2, 'sawtooth', 0.5); this.tone(220, 0.25, 'sawtooth', 0.5, 0.12); this.tone(140, 0.4, 'sawtooth', 0.5, 0.24); },
    fanfare() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.25, 'square', 0.5, i * 0.14)); },
    powerup() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.1, 'square', 0.4, i * 0.08)); },
    coin() { this.tone(988, 0.08, 'square', 0.5); this.tone(1318, 0.18, 'square', 0.4, 0.06); },
    pipe() { this.tone(300, 0.1, 'square', 0.5); this.tone(250, 0.1, 'square', 0.5, 0.1); this.tone(200, 0.2, 'square', 0.5, 0.2); }
};

const Music = {
    isPlaying: false, intervalId: null, current: null, step: 0, nextTime: 0, bpm: 150,
    tracks: {
        overworld:   { lead: ['G4','B4','D5','G5','D5','B4','G4',null,'C5','E5','G5','C6','G5','E5','C5',null], bass: ['G3',null,'G3',null,'C3',null,'C3',null] },
        night:       { lead: ['A4',null,'C5',null,'E5',null,'A5',null,'E5',null,'C5',null,'A4',null,null,null], bass: ['A2',null,null,null,'F2',null,null,null] },
        underground: { lead: ['C4',null,'C4','D4','D#4',null,'D4',null,'C4',null,'G3',null,null,null,null,null], bass: ['C2','C3','A1','A2','G#1','G#2','G1','G2'] }
    },
    play(trackName) {
        if (!AudioEngine.ctx) return; this.stop(); this.current = this.tracks[trackName]; if (!this.current) return;
        this.step = 0; this.nextTime = AudioEngine.ctx.currentTime + 0.05; this.isPlaying = true;
        this.intervalId = setInterval(() => this.scheduler(), 25);
    },
    scheduler() {
        if (!this.isPlaying || !AudioEngine.ctx) return;
        if (AudioEngine.ctx.state === 'suspended') { try { AudioEngine.ctx.resume(); } catch(e) {} }
        while (this.nextTime < AudioEngine.ctx.currentTime + 0.1) {
            this.playStep(this.step, this.nextTime); this.nextTime += (60 / this.bpm) / 2; this.step++;
        }
    },
    playStep(step, time) {
        const lead = this.current.lead[step % this.current.lead.length]; const bass = this.current.bass[step % this.current.bass.length];
        if (lead) AudioEngine.toneAt(AudioEngine.noteFreq(lead), 0.2, 'square', 0.12, time);
        if (bass) AudioEngine.toneAt(AudioEngine.noteFreq(bass), 0.35, 'triangle', 0.16, time);
    },
    stop() { this.isPlaying = false; if (this.intervalId) clearInterval(this.intervalId); this.intervalId = null; }
};

/* ============== KORUMALI KAYIT SİSTEMİ (SAVE) ============== */
const SafeStorage = {
    get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
    set(k,v) { try { localStorage.setItem(k, v); } catch(e) {} },
    remove(k) { try { localStorage.removeItem(k); } catch(e) {} }
};

function saveGame() {
    const data = { level: currentLevelIndex, lives: player.lives, score: score, coins: coinCount, qIndex: globalQIndex };
    SafeStorage.set('kaponSaveData', JSON.stringify(data));
}
function loadGame() {
    const s = SafeStorage.get('kaponSaveData');
    if(s) {
        const data = JSON.parse(s);
        currentLevelIndex = data.level; player.lives = data.lives; score = data.score; coinCount = data.coins; globalQIndex = data.qIndex || 0;
        return true;
    }
    return false;
}
if(SafeStorage.get('kaponSaveData')) { document.getElementById('btn-continue-save').style.display = 'block'; }


/* ============== MOBİL UYUMLU BAĞLAYICILAR ============== */
function bindUIBtn(id, action) {
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.addEventListener('click', action);
    btn.addEventListener('touchstart', action, {passive: false});
}

bindUIBtn('settings-btn', (e) => { e.preventDefault(); settingsScreen.style.display = 'flex'; });
bindUIBtn('btn-close-settings', (e) => { e.preventDefault(); settingsScreen.style.display = 'none'; });
bindUIBtn('btn-fullscreen', (e) => {
    e.preventDefault();
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(err => {}); document.getElementById('btn-fullscreen').innerText = "TAM EKRANDAN ÇIK"; } 
    else { document.exitFullscreen(); document.getElementById('btn-fullscreen').innerText = "TAM EKRAN YAP"; }
});

document.getElementById('vol-music').addEventListener('input', (e) => { AudioEngine.musicVol = parseFloat(e.target.value); AudioEngine.updateVolumes(); });
document.getElementById('vol-sfx').addEventListener('input', (e) => { AudioEngine.sfxVol = parseFloat(e.target.value); AudioEngine.updateVolumes(); });

const keys = { right: false, left: false, up: false, down: false, fire: false };
function resetKeys() { keys.right = false; keys.left = false; keys.up = false; keys.down = false; keys.fire = false; }
function inputBlocked() { return quizScreen.style.display === 'flex' || gameOverScreen.style.display === 'flex' || lifeLostScreen.style.display === 'flex' || startScreen.style.display === 'flex' || levelStartScreen.style.display === 'flex' || levelCompleteScreen.style.display === 'flex' || settingsScreen.style.display === 'flex'; }

window.addEventListener('keydown', (e) => { 
    if (inputBlocked()) return; 
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true; 
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true; 
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') { keys.up = true; e.preventDefault(); } 
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { keys.down = true; e.preventDefault(); }
    if (e.code === 'KeyX' || e.code === 'ControlLeft') keys.fire = true; 
});
window.addEventListener('keyup', (e) => { 
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false; 
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false; 
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false; 
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false; 
    if (e.code === 'KeyX' || e.code === 'ControlLeft') keys.fire = false; 
});

const bindControl = (elem, isDown) => {
    const handler = e => { e.preventDefault(); if(elem.id === 'btn-left') keys.left = isDown; else if(elem.id === 'btn-right') keys.right = isDown; else if(elem.id === 'btn-down') keys.down = isDown; else if(elem.id === 'btn-fire') keys.fire = isDown; else keys.up = isDown; };
    if(isDown) { elem.addEventListener('pointerdown', handler); elem.addEventListener('touchstart', handler, {passive: false}); }
    else { elem.addEventListener('pointerup', handler); elem.addEventListener('touchend', handler); elem.addEventListener('pointercancel', handler); elem.addEventListener('touchcancel', handler); }
};
const btnLeft = document.getElementById('btn-left'); const btnRight = document.getElementById('btn-right'); const btnJump = document.getElementById('btn-jump'); const btnDown = document.getElementById('btn-down'); const btnFire = document.getElementById('btn-fire');
bindControl(btnLeft, true); bindControl(btnLeft, false); bindControl(btnRight, true); bindControl(btnRight, false); bindControl(btnJump, true); bindControl(btnJump, false); bindControl(btnDown, true); bindControl(btnDown, false); bindControl(btnFire, true); bindControl(btnFire, false);
function updateFireButtonVisibility() { btnFire.style.display = (player.powerState === 'fire') ? 'flex' : 'none'; }

/* ============== OYUN DURUMU ============== */
let score = 0; let coinCount = 0; let cameraX = 0; let isPaused = false; let isStarted = false; let reqId = null;
let checkpoints = []; let checkpointIndex = 0; let shuffledQuestions = []; let poleX = 0; let flagSeq = null; let isInSecretRoom = false;

const questionsData = [
    { q: "Sana resmi olarak ilk aşkım dediğim tarih?", answers: ["13 mart", "13.03", "13mart"], failMsg: "İlk aşkım dediğim günü nasıl bilemezsin! 💔" },
    { q: "Tartıştığımızda genellikle kim haklı olur? 🙄", answers: ["irem", "ben"], failMsg: "Daima sen haklısın, bunu bilmen lazımdı! 😂" },
    { q: "Kim daha düşürücü? 🫠", answers: ["kerem", "sen"], failMsg: "Bence bunu bir daha düşün... 😉" },
    { q: "Kim daha uykucu?", answers: ["irem", "ben"], failMsg: "Uykucu şirin kim biliyoruz... 😴" },
    { q: "Kim daha çok seven kişinin PLANLARINI BOZUYOR????????? 🤔", answers: ["irem", "ben"], failMsg: "İtiraf etsene planları kim bozuyor! 🧐" },
    { q: "Sana aşkım deyip korktuğum tarih?", answers: ["14 subat", "14.02", "sevgililer gunu", "14subat"], failMsg: "Korkudan titrediğim o günü nasıl bilmezsin! 😱" },
    { q: "Göndermelerin olduğu tartışma tarihi?", answers: ["yok", "-", "hic", "boyle bir tarih yok", "hatirlamiyorum"], failMsg: "O kadar gönderme boşa mı gitti yani? 🙄" },
    { q: "WP'ye geçtiğimiz tarih?", answers: ["1 nisan", "01.04", "1nisan"], failMsg: "O tarihi bileceksin... O kadar heyecanlanmıştık! 😤" },
    { q: "Kim numaralaşmak istedi? 🙄 (DÜNYANIN EN UTANÇ ANI)", answers: ["kerem", "sen"], failMsg: "O utanç anını başkasına yıkamazsın! 🫣" },
    { q: "Benim çok sevip (fav değil) senin HİÇ sevmediğin yemek?", answers: ["nohut"], failMsg: "Nasıl sevmezsin nohutu ya... Bilemedin! 😡" },
    { q: "Senin bayıla bayıla yediğin, benim nefret ettiğim o 'Gıda Katliamı' yemek? 🤢🤮", answers: ["doner", "soslu", "soslu doner", "bol soslu doner"], failMsg: "O soslu döneri midesi alan tek kişi sensin! 🤮" },
    { q: "Kurgu yaptığımızda çıktığımız date'de sen hangi tatlıyı yedin?", answers: ["fistik", "sarma", "fistik sarma"], failMsg: "Yediğin tatlıyı bile unuttun mu? İnanılmaz... 🍰" },

        if (this.isDead || isPaused || !isStarted || this.levelFinished || this.pipeTimer > 0) return;

        if (this.vx !== 0 && this.grounded) { this.walkTimer++; if (this.walkTimer > 8) { this.walkToggle = !this.walkToggle; this.walkTimer = 0; } }

                h.collected = true;
                if(this.lives < MAX_LIVES) { this.lives++; updateHeartsUI(); } score += 500; updateScore(); AudioEngine.powerup();
            }

        for (let i = 0; i < coins.length; i++) {

            const pu = powerups[i];

    },

    checkCollisions(axis, prevPos) {
        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];

            if (this.x < p.x + p.width && this.x + this.width > p.x && this.y < p.y + p.height && this.y + this.height > p.y) {

function applyPowerSize(prevHeight, prevWidth) {
    const oldBottom = player.y + prevHeight; const oldCenterX = player.x + (prevWidth !== undefined ? prevWidth : player.width) / 2;
    if (player.powerState === 'small') { player.width = 24; player.height = 32; } else { player.width = 36; player.height = 48; }
    player.y = oldBottom - player.height; player.x = oldCenterX - player.width / 2; if (player.x < 0) player.x = 0;
}

function hitByEnemy(msg) {
    if (player.isDead || player.invincible > 0 || player.starTimer > 0) return;
    if (player.powerState !== 'small') {
        const prevH = player.height, prevW = player.width; player.powerState = 'small'; applyPowerSize(prevH, prevW);
        player.invincible = 90; updateFireButtonVisibility(); try { AudioEngine.wrong(); } catch(e) {}
    } else { loseLife(msg); }
}

function collectPowerup(pu) {
    pu.collected = true;
    if (pu.type === 'mushroom') {
        if (player.powerState === 'small') { const prevH = player.height, prevW = player.width; player.powerState = 'big'; applyPowerSize(prevH, prevW); AudioEngine.powerup(); popupMsg(pu.x, pu.y, '🍄 BÜYÜDÜN!'); } 
        else { score += 500; updateScore(); AudioEngine.powerup(); }
    } else if (pu.type === 'fire') {
        if (player.powerState !== 'fire') { const prevH = player.height, prevW = player.width; player.powerState = 'fire'; applyPowerSize(prevH, prevW); AudioEngine.powerup(); popupMsg(pu.x, pu.y, '🔥 ATEŞ GÜCÜ!'); } 
        else { score += 500; updateScore(); AudioEngine.powerup(); }
    } else if (pu.type === 'star') {
        player.starTimer = 400; AudioEngine.powerup(); popupMsg(pu.x, pu.y, '⭐ YENİLMEZLİK!');
        try { Music.bpm = 220; } catch(e){}
    }
    updateFireButtonVisibility();
}

function shootFireball() {
    if (player.powerState !== 'fire' || isPaused || !isStarted) return; if (fireballs.length >= 2) return;
    const dir = player.facingRight ? 1 : -1; fireballs.push({ x: player.x + player.width / 2, y: player.y + player.height / 2, vx: 7 * dir, life: 0 });
    try { AudioEngine.tone(300, 0.08, 'square', 0.4); } catch(e) {}
}

function updateFireballs() {
    if (isPaused || !isStarted) return;
    for (let i = fireballs.length - 1; i >= 0; i--) {
        const f = fireballs[i]; f.x += f.vx; f.life++; let hit = false;
        enemies.forEach(e => {
            if (e.alive && f.x > e.x && f.x < e.x + e.width && f.y > e.y && f.y < e.y + e.height) {
                if (e.kind === 'koopa' && e.state !== 'shell') { e.state = 'shell'; e.vx = 0; e.moving = false; }
                else { e.alive = false; }
                score += 100; updateScore(); AudioEngine.stomp(); hit = true;
            }
        });
        if (hit || f.life > 45 || f.x < cameraX - 50 || f.x > cameraX + canvas.width + 50) fireballs.splice(i, 1);
    }
}

function addCoinRow(startX, y, count, spacing) { for (let i = 0; i < count; i++) { coins.push({ x: startX + i * spacing, y: y, collected: false }); } }
function addStaircase(startX, groundY, steps, cubeSize) { for (let s = 0; s < steps; s++) { const stepHeight = s + 1; const stepX = startX + s * cubeSize; for (let c = 0; c < stepHeight; c++) { platforms.push({ x: stepX, y: groundY - (c + 1) * cubeSize, width: cubeSize, height: cubeSize, type: 'solid' }); } } return startX + steps * cubeSize; }
function addPyramid(startX, groundY, steps, cubeSize) { const upEnd = addStaircase(startX, groundY, steps, cubeSize); for (let s = 0; s < steps - 1; s++) { const stepHeight = steps - 1 - s; const stepX = upEnd + s * cubeSize; for (let c = 0; c < stepHeight; c++) { platforms.push({ x: stepX, y: groundY - (c + 1) * cubeSize, width: cubeSize, height: cubeSize, type: 'solid' }); } } return upEnd + (steps - 1) * cubeSize; }
function giveCoin(x, y) { coinCount++; score += 10; updateScore(); coinPopups.push({ x: x, y: y, life: 0 }); try { AudioEngine.coin(); } catch(e) {} if (coinCount >= 100) { coinCount -= 100; if (player.lives < MAX_LIVES) { player.lives++; updateHeartsUI(); AudioEngine.powerup(); } else { score += 1000; updateScore(); AudioEngine.powerup(); } } updateCoinsUI(); }

function updateEnemies() {
    if (isPaused || !isStarted) return;
    enemies.forEach(e => {
        if (!e.alive) return;
        if (e.kind === 'piranha') { e.timer += 0.04; e.y = e.startY - Math.abs(Math.sin(e.timer)) * 42; } 
        else if (e.kind === 'flyer') { e.y += e.vy; if (e.y <= e.minY || e.y >= e.maxY) e.vy *= -1; } 
        else if (e.kind === 'saw') { e.rotation = (e.rotation || 0) + 0.25; e.x += e.vx; if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1; }
        else if (e.kind === 'koopa') {
            if (e.state === 'shell') {
                if (e.moving) {
                    e.x += e.vx;
                    enemies.forEach(other => {
                        if (other !== e && other.alive && other.kind !== 'koopa' && other.kind !== 'saw') {
                            if (e.x < other.x + other.width && e.x + e.width > other.x && e.y < other.y + other.height && e.y + e.height > other.y) {
                                other.alive = false; score += 100; updateScore();
                            }
                        }
                    });
                    if (e.x <= e.minX || e.x >= e.maxX) { e.vx = 0; e.moving = false; }
                }
            } else { e.x += e.vx; if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1; }
        }
        else { e.x += e.vx; if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1; }
    });
}
function updateMovingPlatforms() {
    if (isPaused || !isStarted) return;
    platforms.forEach(p => {
        if (p.type === 'moving') { p.y += p.vy; if (p.y <= p.minY || p.y >= p.maxY) p.vy *= -1; }
        if (p.bounce) { p.bounce -= 2; if (p.bounce < 0) p.bounce = 0; }
    });
}

/* ============== QUIZ SİSTEMİ ============== */
function triggerQuiz(blockInfo) {
    resetKeys(); isPaused = true; currentQuizBlock = blockInfo;
    const quizData = questionsData[blockInfo.qIndex];
    document.getElementById('quiz-question').innerText = quizData.q;
    quizInput.value = ''; quizScreen.style.display = 'flex'; requestAnimationFrame(() => quizInput.focus());
}

bindUIBtn('quiz-submit', (e) => { e.preventDefault(); checkTypedAnswer(); });
quizInput.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); checkTypedAnswer(); }});

function normalizeText(s) { return s.toLowerCase().trim().replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/i̇/g, 'i').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u'); }

function checkTypedAnswer() {
    if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') { try { AudioEngine.ctx.resume(); } catch(e) {} }
    const userAnswer = normalizeText(quizInput.value);
    if (userAnswer.length < 1) return; 

    if(userAnswer === "seni seviyorum" || userAnswer === "seni cok seviyorum") {
        quizScreen.style.display = 'none'; resetKeys(); currentQuizBlock.hit = true;
        if(player.lives < MAX_LIVES) { player.lives++; updateHeartsUI(); AudioEngine.powerup(); alert("Gizli Şifre Bulundu! 💖\nKerem de seni çok seviyor... +1 Can kazandın!"); } 
        else { score += 1000; updateScore(); AudioEngine.powerup(); alert("Gizli Şifre Bulundu! 💖\nKerem de seni çok seviyor..."); }
        isPaused = false; saveGame(); return;
    }

    const quizData = questionsData[currentQuizBlock.qIndex];
    let isCorrect = quizData.answers.some(ans => { if (userAnswer === ans || userAnswer.includes(ans)) return true; return false; });

    quizScreen.style.display = 'none'; resetKeys();
    if (isCorrect) { currentQuizBlock.hit = true; score += 500; updateScore(); isPaused = false; AudioEngine.correct(); giveCoin(currentQuizBlock.x + currentQuizBlock.width / 2 - 8, currentQuizBlock.y - 12); saveGame(); } 
    else { isPaused = false; AudioEngine.wrong(); loseLife(quizData.failMsg); }
}

    });

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.5; ctx.fillStyle = currentLevelIndex % 2 === 0 ? '#0000a8' : '#c84c0c'; ctx.fillRect(p.x, p.y, 8, 8); if (p.y > (isInSecretRoom ? 2000 : 600)) particles.splice(i, 1);
    });
}

/* ============== UI VE CAN SİSTEMİ ============== */
function updateScore() { document.getElementById('score').innerText = String(score).padStart(6, '0'); }
function updateHeartsUI() { document.getElementById('hearts').innerText = '❤x' + player.lives; }
function updateCoinsUI() { document.getElementById('coins').innerText = 'x' + String(coinCount).padStart(3, '0'); }
function updateCoinPopups() { for (let i = coinPopups.length - 1; i >= 0; i--) { coinPopups[i].life++; if (coinPopups[i].life > 40) coinPopups.splice(i, 1); } }

function loseLife(msg) {
    if (player.isDead) return;
    resetKeys(); player.isDead = true; isPaused = true; player.lives--;
    player.powerState = 'small'; player.width = 24; player.height = 32; player.invincible = 0; player.starTimer = 0;
    updateFireButtonVisibility(); updateHeartsUI(); Music.stop(); try { AudioEngine.lifeLost(); } catch(e) {}

    if (player.lives <= 0) {
        document.getElementById('go-title').innerText = "YANDIN! 💀\n" + msg; document.getElementById('go-title').style.color = '#ff003c'; document.getElementById('btn-restart').innerText = 'EN BAŞA DÖN'; gameOverScreen.style.display = 'flex'; SafeStorage.remove('kaponSaveData');
    } else {
        document.getElementById('ll-title').innerText = 'CAN KAYBETTİN!'; document.getElementById('ll-sub').innerText = msg; lifeLostScreen.style.display = 'flex';
    }
}

function fullRestart() {
    resetKeys(); Music.stop(); player.lives = MAX_LIVES; player.x = 50; player.y = 50; player.vx = 0; player.vy = 0; player.isDead = false; player.levelFinished = false; flagSeq = null; isPaused = false; isStarted = false; score = 0; coinCount = 0;
    player.powerState = 'small'; player.width = 24; player.height = 32; player.invincible = 0; player.starTimer = 0; updateFireButtonVisibility();
    currentLevelIndex = 1; globalQIndex = 0; initQuestions(); updateScore(); updateHeartsUI(); updateCoinsUI();
    SafeStorage.remove('kaponSaveData'); gameOverScreen.style.display = 'none'; startLevelTransition();
}

function winGame() {
    if (player.isDead) return; resetKeys(); player.isDead = true; Music.stop(); try { AudioEngine.fanfare(); } catch(e){}
    document.getElementById('go-title').innerText = "VEEE FİNAL! 💖\nTÜM SORULARI GEÇTİN!"; document.getElementById('go-title').style.color = "#00ff66"; document.getElementById('btn-restart').innerText = "SENİ ÇOK SEVİYORUM!"; gameOverScreen.style.display = 'flex'; SafeStorage.remove('kaponSaveData');
}

function showLevelCompleteThenMap() {
    levelCompleteScreen.style.display = 'flex'; levelCompleteScreen._proceeded = false;
    const proceed = () => {
        if (levelCompleteScreen._proceeded) return; levelCompleteScreen._proceeded = true; levelCompleteScreen.style.display = 'none';
        currentLevelIndex++; player.x = 50; player.y = 50; player.vx = 0; player.vy = 0; player.levelFinished = false; createLevel(); startLevelTransition();
    };
    levelCompleteScreen._proceedFn = proceed; setTimeout(proceed, 1600);
}

function updateFlagSequence() {
    if (!flagSeq) return;
    if (flagSeq.phase === 'slide') {
        player.y += 4.2; if (player.y >= 388) { player.y = 388; flagSeq.phase = 'walk'; flagSeq.timer = 0; }
    } else if (flagSeq.phase === 'walk') {
        player.x += 2.3; player.facingRight = true; player.walkTimer++; if (player.walkTimer > 6) { player.walkToggle = !player.walkToggle; player.walkTimer = 0; }
        flagSeq.timer++; if (flagSeq.timer > 65) { flagSeq = null; setTimeout(() => { showLevelCompleteThenMap(); }, 350); }
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let targetCamX = player.x - canvas.width / 2 + player.width / 2; if (targetCamX < 0) targetCamX = 0;
    const maxCam = poleX ? poleX + 400 - canvas.width / 2 : 3500; if (!isInSecretRoom && targetCamX > maxCam) targetCamX = maxCam;
    cameraX = targetCamX;
    ctx.save(); ctx.translate(-cameraX, 0); drawGame(); updateEnemies(); updateMovingPlatforms(); updateFireballs(); if (!isPaused) updateCoinPopups(); updateFlagSequence(); player.update(); player.draw(); ctx.restore();
    if (reqId) cancelAnimationFrame(reqId); reqId = requestAnimationFrame(animate);
}

initQuestions(); createLevel(); updateScore(); updateHeartsUI(); updateCoinsUI(); animate();
</script>
